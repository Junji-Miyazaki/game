<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>造形テスト — NIGHT WALL（仮）</title>
<style>
html,body{margin:0;height:100%;background:#05070d;overflow:hidden;touch-action:none;font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif;color:#cfe;-webkit-user-select:none;user-select:none}
canvas{display:block;position:fixed;left:0;top:0}
#hud{position:fixed;left:8px;top:calc(6px + env(safe-area-inset-top));font-size:12px;line-height:1.45;pointer-events:none;text-shadow:0 0 4px #000;white-space:pre}
#bar{position:fixed;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#05070dd9 40%)}
#bar button{font:inherit;font-size:13px;color:#dff;background:#0d1a26;border:1px solid #1d6f86;border-radius:8px;padding:7px 10px;min-height:36px}
#bar button.on{border-color:#5ff0ff;box-shadow:0 0 8px #2fd8ff88;color:#fff}
#bar button.hide{display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="bar">
  <button data-m="show">並べる</button>
  <button data-m="def">防衛</button>
  <button data-m="fps">一人称</button>
  <button id="bYaw">向き:正面</button>
  <button id="bState">動き:歩く</button>
  <button id="bNum">数:中</button>
  <button id="bShoot">自動射撃:ON</button>
</div>
<script src="rig.js"></script>
<script>
'use strict';
// =====================================================================
// 造形テスト（段階0）：人型を「3D骨格 → 傾けて投影 → 太線と円で描く」方式で作り、
// 大・中・実寸、防衛（見下ろし）、一人称（近くで大きく）で見え方と速さを確かめる。
// 画像素材なし。小さく映るものは先に16コマ描いておき貼る（キャッシュ）。
// =====================================================================
const TAU = Math.PI * 2;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + Math.random() * (b - a);

// 人型の描画は rig.js（造形テストとゲーム本体で共用）
const { TYPES, T_FAT, T_SOL, drawRig } = Rig;
const getSet = Rig.getSet;
const blit = (set, ph, sx, sy, sc, mir) => Rig.blit(ctx, DPR, set, ph, sx, sy, sc, mir);
const live = (P, ph, sx, sy, sc, mir, tilt, state) => Rig.live(ctx, DPR, P, ph, sx, sy, sc, mir, tilt, state);

// ---------------------------------------------------------------------
// カメラ（道の上の x, z を画面へ）。防衛＝高い位置から、一人称＝目の高さ
// ---------------------------------------------------------------------
let mode = 'show';
const TILT = { def: 0.62, fps: 0.1 };
const cam = {};
function setupCamera() {
  cam.cx = W / 2;
  if (mode === 'fps') { cam.hy = 0.42 * H; cam.F = 0.75 * H; cam.Hc = 1.6; cam.fogA = 22; cam.fogB = 60; cam.zw = 1.9; }
  else {
    const scw = Math.min(0.85 * W / 14, 0.05 * H);
    cam.zw = 20; cam.F = scw * cam.zw; cam.hy = 0.15 * H; cam.Hc = (0.64 * H - cam.hy) / scw; cam.fogA = 50; cam.fogB = 100;
  }
}
const scr = (x, z) => [cam.cx + cam.F * x / z, cam.hy + cam.F * cam.Hc / z, cam.F / z];
const fogAt = z => clamp((cam.fogB - z) / (cam.fogB - cam.fogA), 0, 1);

const city = [];
for (let i = 0, x = 0; x < 1; i++) { const w = rnd(0.02, 0.07); city.push({ x, w, h: rnd(0.01, 0.07), lit: Math.random() }); x += w + rnd(0, 0.01); }

function quad(x0, x1, z0, z1, col) {
  const a = scr(x0, z0), b = scr(x1, z0), c = scr(x1, z1), d = scr(x0, z1);
  ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(c[0], c[1]); ctx.lineTo(d[0], d[1]); ctx.fill();
}
function drawWorld() {
  const sky = ctx.createLinearGradient(0, 0, 0, cam.hy);
  sky.addColorStop(0, '#02030a'); sky.addColorStop(1, '#161c38');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, cam.hy + 1);
  for (const b of city) {
    const bh = b.h * H;
    ctx.fillStyle = '#0a0d1b'; ctx.fillRect(b.x * W, cam.hy - bh, b.w * W, bh);
    if (b.lit > 0.6) { ctx.fillStyle = 'rgba(255,190,90,0.35)'; ctx.fillRect(b.x * W + b.w * W * 0.3, cam.hy - bh * 0.7, 2, 2); }
  }
  ctx.fillStyle = '#07090f'; ctx.fillRect(0, cam.hy, W, H - cam.hy);
  const zn = mode === 'fps' ? 0.3 : 3, zf = 400;
  quad(-7, 7, zn, zf, '#10141d');
  for (let z = mode === 'fps' ? 1 : 4; z < 120; z += 6) {
    const a = 1 - z / 120;
    quad(-2.4, -2.25, z, z + 3, `rgba(120,140,170,${0.35 * a})`);
    quad(2.25, 2.4, z, z + 3, `rgba(120,140,170,${0.35 * a})`);
  }
  quad(-7.1, -6.9, zn, zf, 'rgba(255,60,200,0.55)');
  quad(6.9, 7.1, zn, zf, 'rgba(60,230,255,0.55)');
  for (let z = mode === 'fps' ? 2 : 6; z < 110; z += 6) {
    const a = fogAt(z);
    for (const x of [-7.7, 7.7]) {
      const [sx, gy, sc] = scr(x, z);
      ctx.strokeStyle = `rgba(80,230,255,${0.6 * a})`; ctx.lineWidth = Math.max(1, 0.08 * sc);
      ctx.beginPath(); ctx.moveTo(sx, gy); ctx.lineTo(sx, gy - 0.9 * sc); ctx.stroke();
    }
  }
  const hz = ctx.createLinearGradient(0, cam.hy, 0, cam.hy + 0.1 * H);
  hz.addColorStop(0, 'rgba(22,28,56,0.9)'); hz.addColorStop(1, 'rgba(22,28,56,0)');
  ctx.fillStyle = hz; ctx.fillRect(0, cam.hy, W, 0.1 * H);
}

// ---------------------------------------------------------------------
// 群れ
// ---------------------------------------------------------------------
const PRESET = { def: [[120, 10], [300, 20], [600, 32]], fps: [[12], [30], [60]] };
const PRESET_NAME = ['少', '中', '多'];
let presetIdx = 1, autoShoot = true;
let zs = [], sols = [], particles = [], tracers = [], flashes = [];
let wallHP = 100, clawing = 0, shotAcc = 0, kills = 0, aim = null, gunKick = 0, liveCount = 0;
const SPEEDMUL = { def: 1.3, fps: 1.0 };

function newZ(z) {
  const ti = Math.random() < 0.12 ? T_FAT : (Math.random() * 6) | 0;
  return {
    ti, z, x: mode === 'fps' ? rnd(-3.2, 3.2) : rnd(-6.3, 6.3), ph: Math.random(),
    spd: rnd(0.8, 1.2) * (ti === T_FAT ? 0.75 : 1), mir: Math.random() < 0.5, state: 'walk',
    stopZ: mode === 'fps' ? rnd(1.7, 2.6) : cam.zw + 0.7 + rnd(0, 2.8), wob: Math.random() * TAU, gen: 0
  };
}
function respawn(o) { const g = o.gen + 1; Object.assign(o, newZ(mode === 'fps' ? rnd(35, 58) : rnd(60, 88))); o.gen = g; }
function initEntities() {
  particles = []; tracers = []; flashes = []; wallHP = 100; kills = 0; aim = null;
  if (mode === 'def') {
    const [nz, ns] = PRESET.def[presetIdx];
    zs = Array.from({ length: nz }, () => newZ(rnd(cam.zw + 6, 88)));
    sols = [];
    const per = 16;
    for (let i = 0; i < ns; i++) {
      const row = (i / per) | 0, col = i % per, n = Math.min(per, ns - row * per);
      const sp = Math.min(0.8, 12.6 / Math.max(1, n - 1));
      sols.push({ x: (col - (n - 1) / 2) * sp + (row % 2) * 0.4, z: cam.zw - 0.8 - row * 1.3, ph: Math.random() });
    }
  } else if (mode === 'fps') {
    zs = Array.from({ length: PRESET.fps[presetIdx][0] }, () => newZ(rnd(6, 58)));
    sols = [];
  } else { zs = []; sols = []; }
}

function burst(o) {
  const P = TYPES[o.ti];
  const cols = [P.skin, P.skin, P.skin, P.skin, P.shirt, P.shirt, P.shirt, P.shirt, P.pants, P.pants, P.pants, '#a8ff6a', '#a8ff6a', '#a8ff6a'];
  for (const col of cols) {
    particles.push({ x: o.x + rnd(-0.2, 0.2), z: o.z + rnd(-0.2, 0.2), h: rnd(0.3, 1.6), vx: rnd(-2.5, 2.5), vz: rnd(-2.5, 2.5),
      vh: rnd(1.5, 5), life: rnd(0.5, 0.95), max: 0.95, col, s: rnd(0.06, 0.14), glow: col === '#a8ff6a' });
  }
  particles.push({ x: o.x, z: o.z, h: 1.65, vx: rnd(-1, 1), vz: rnd(-1, 1), vh: rnd(3, 5), life: 0.9, max: 0.9, col: P.skin, s: 0.2, glow: false });
  flashes.push({ x: o.x, z: o.z, t: 0 });
  if (particles.length > 1800) particles.splice(0, particles.length - 1800);
  kills++;
}
function kill(o) { burst(o); respawn(o); }

function update(dt, T) {
  if (mode === 'show') return;
  const sm = SPEEDMUL[mode];
  clawing = 0;
  for (const o of zs) {
    const P = TYPES[o.ti];
    if (o.state === 'walk') {
      o.z -= 1.2 / P.cycle * o.spd * sm * dt;
      o.ph = (o.ph + dt / P.cycle * o.spd * sm) % 1;
      o.x += Math.sin(T * 0.7 + o.wob) * 0.15 * dt;
      if (o.z <= o.stopZ) { o.z = o.stopZ; o.state = 'claw'; o.ph = Math.random(); }
    } else { o.ph = (o.ph + dt / 0.9) % 1; clawing++; }
  }
  if (mode === 'def') {
    wallHP -= clawing * dt * 0.4; if (wallHP <= 0) wallHP = 100;
    for (const s of sols) s.ph = (s.ph + dt) % 1;
    if (autoShoot && sols.length) {
      shotAcc += dt * Math.min(36, sols.length * 1.6);
      while (shotAcc >= 1) {
        shotAcc -= 1;
        let best = null;
        for (let k = 0; k < 8; k++) { const c = zs[(Math.random() * zs.length) | 0]; if (c.z < cam.zw + 45 && (!best || c.z < best.z)) best = c; }
        if (!best) continue;
        const s = sols[(Math.random() * sols.length) | 0];
        tracers.push({ sx: s.x, sz: s.z, tx: best.x, tz: best.z, o: best, gen: best.gen, t: 0, dur: 0.09 });
      }
    }
  }
  for (let i = tracers.length - 1; i >= 0; i--) {
    const tr = tracers[i]; tr.t += dt;
    if (tr.t >= tr.dur) { if (tr.o.gen === tr.gen) kill(tr.o); tracers.splice(i, 1); }
  }
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt; if (p.life <= 0) { particles.splice(i, 1); continue; }
    if (p.h > 0) { p.vh -= 12 * dt; p.x += p.vx * dt; p.z += p.vz * dt; p.h += p.vh * dt; if (p.h < 0) p.h = 0; }
  }
  for (let i = flashes.length - 1; i >= 0; i--) { flashes[i].t += dt; if (flashes[i].t > 0.3) flashes.splice(i, 1); }
  gunKick = Math.max(0, gunKick - dt * 6);
}

function drawZombie(o) {
  const [sx, gy, sc] = scr(o.x, o.z);
  if (sx < -2 * sc || sx > W + 2 * sc || o.z < 0.5) return;
  const P = TYPES[o.ti];
  ctx.globalAlpha = fogAt(o.z);
  if (ctx.globalAlpha <= 0.02) { ctx.globalAlpha = 1; return; }
  if (mode === 'fps' && sc * 1.8 > 150) { live(P, o.ph, sx, gy, sc, o.mir, TILT.fps, o.state); liveCount++; }
  else blit(getSet(o.ti, TILT[mode], o.state), o.ph, sx, gy, sc, o.mir);
  ctx.globalAlpha = 1;
}
function drawSoldier(s) {
  const [sx, gy, sc] = scr(s.x, s.z);
  blit(getSet(T_SOL, TILT.def, autoShoot ? 'aim' : 'walk'), autoShoot ? s.ph : 0, sx, gy, sc, false);
}
function drawWall() {
  const z = cam.zw, hgt = 1.1;
  const [lx, ly, lsc] = scr(-7.4, z), [rx] = scr(7.4, z);
  const top = ly - hgt * lsc;
  ctx.fillStyle = '#121a27'; ctx.fillRect(lx, top, rx - lx, ly - top);
  ctx.strokeStyle = 'rgba(80,230,255,0.25)'; ctx.lineWidth = 1;
  for (let x = -7.4; x <= 7.4; x += 1.85) { const [px] = scr(x, z); ctx.beginPath(); ctx.moveTo(px, top); ctx.lineTo(px, ly); ctx.stroke(); }
  const dmg = 1 - wallHP / 100;
  ctx.strokeStyle = `rgb(${80 + 175 * dmg | 0},${230 - 170 * dmg | 0},${255 - 200 * dmg | 0})`;
  ctx.lineWidth = Math.max(2, 0.12 * lsc); ctx.shadowColor = ctx.strokeStyle; ctx.shadowBlur = 8;
  ctx.beginPath(); ctx.moveTo(lx, top); ctx.lineTo(rx, top); ctx.stroke(); ctx.shadowBlur = 0;
}
function drawFx() {
  for (const tr of tracers) {
    const k = tr.t / tr.dur;
    const [ax, ay, asc] = scr(tr.sx, tr.sz), [bx, by, bsc] = scr(tr.tx, tr.tz);
    const y0 = ay - 1.25 * asc, y1 = by - 1.2 * bsc;
    const k0 = Math.max(0, k - 0.35);
    ctx.strokeStyle = 'rgba(255,240,160,0.9)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(ax + (bx - ax) * k0, y0 + (y1 - y0) * k0); ctx.lineTo(ax + (bx - ax) * k, y0 + (y1 - y0) * k); ctx.stroke();
  }
  ctx.globalCompositeOperation = 'lighter';
  for (const fl of flashes) {
    const [sx, gy, sc] = scr(fl.x, fl.z); const k = fl.t / 0.3;
    ctx.strokeStyle = `rgba(170,255,120,${0.8 * (1 - k)})`; ctx.lineWidth = Math.max(1, 0.06 * sc);
    ctx.beginPath(); ctx.arc(sx, gy - 1.0 * sc, (0.2 + 0.9 * k) * sc, 0, TAU); ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';
  for (const p of particles) {
    const [sx, gy, sc] = scr(p.x, p.z); if (p.z < 0.4) continue;
    const s = Math.max(1.2, p.s * sc);
    ctx.globalAlpha = clamp(p.life / p.max * 1.5, 0, 1);
    if (p.glow) ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = p.col; ctx.fillRect(sx - s / 2, gy - p.h * sc - s / 2, s, s);
    if (p.glow) ctx.globalCompositeOperation = 'source-over';
  }
  ctx.globalAlpha = 1;
}
function drawFpsOverlay(T) {
  if (clawing > 0) {
    const a = 0.22 + 0.12 * Math.sin(T * 8);
    const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.75);
    g.addColorStop(0, 'rgba(255,0,0,0)'); g.addColorStop(1, `rgba(255,20,20,${a})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  if (aim) {
    ctx.strokeStyle = 'rgba(120,250,255,0.9)'; ctx.lineWidth = 1.5;
    const r = 12; ctx.beginPath();
    ctx.moveTo(aim[0] - r, aim[1]); ctx.lineTo(aim[0] - 4, aim[1]); ctx.moveTo(aim[0] + 4, aim[1]); ctx.lineTo(aim[0] + r, aim[1]);
    ctx.moveTo(aim[0], aim[1] - r); ctx.lineTo(aim[0], aim[1] - 4); ctx.moveTo(aim[0], aim[1] + 4); ctx.lineTo(aim[0], aim[1] + r);
    ctx.stroke();
  }
  const k = gunKick, bx = W * 0.6, by = H - 70 + k * 14;
  ctx.fillStyle = '#0b1520'; ctx.strokeStyle = 'rgba(85,240,255,0.9)'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(bx, by + 10); ctx.lineTo(bx + W * 0.16, by - 42); ctx.lineTo(bx + W * 0.24, by - 36); ctx.lineTo(bx + W * 0.2, by + 4);
  ctx.lineTo(W + 10, by + 40); ctx.lineTo(W + 10, H + 10); ctx.lineTo(bx + 20, H + 10); ctx.closePath(); ctx.fill(); ctx.stroke();
  if (k > 0.6) {
    ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = 'rgba(255,230,140,0.8)';
    ctx.beginPath(); ctx.arc(bx + W * 0.2, by - 44, 14 * k, 0, TAU); ctx.fill(); ctx.globalCompositeOperation = 'source-over';
  }
}

// ---------------------------------------------------------------------
// 並べる：大・中は毎フレーム描く、実寸はゲームと同じキャッシュ
// ---------------------------------------------------------------------
const SHOW = [0, 1, 2, 3, 4, 5, T_FAT, T_SOL], SHOW_L = ['Tシャツ', '会社員', 'パーカー', 'ワンピース', '作業員', 'タンク', '太った', '兵士'];
const YAWS = [[0, '正面'], [0.75, '斜め'], [Math.PI / 2, '横'], [null, '回転']];
let yawIdx = 0, showState = 'walk';
function drawShow(T) {
  ctx.fillStyle = '#070a12'; ctx.fillRect(0, 0, W, H);
  const top = 64, bottom = H - 70, avail = bottom - top;
  const yaw = YAWS[yawIdx][0] === null ? T * 0.8 : YAWS[yawIdx][0];
  // 大きい段を2つ（4体ずつ）＋実寸の段
  const rows = [[0.41, SHOW.slice(0, 4)], [0.41, SHOW.slice(4)], [0.18, SHOW]];
  let y = top;
  rows.forEach(([r, list], ri) => {
    const rh = avail * r, gy = y + rh * (ri === 2 ? 0.8 : 0.86), colW = W / list.length;
    const charH = ri === 2 ? 24 : Math.min(rh * 0.78, colW * 2.3);
    const S = charH / 1.85;
    ctx.strokeStyle = '#1b2436'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke();
    ctx.fillStyle = '#5d7a8c'; ctx.font = '11px system-ui'; ctx.textAlign = 'left';
    if (ri !== 1) ctx.fillText(ri === 0 ? '大（毎フレーム描画）' : '実寸（ゲームと同じ貼り付け）', 6, y + 12);
    list.forEach((ti, i) => {
      const P = TYPES[ti], sx = colW * (i + 0.5), gi = SHOW.indexOf(ti);
      const st = P.kind === 'z' ? showState : (showState === 'claw' ? 'aim' : 'walk');
      const cyc = st === 'claw' ? 0.9 : st === 'aim' ? 1 : P.cycle;
      const ph = ((T / cyc) + gi * 0.17) % 1;
      if (ri === 2 && YAWS[yawIdx][0] === 0) blit(getSet(ti, TILT.def, st), ph, sx, gy, S, false);
      else drawRig(ctx, P, ph, S, sx, gy, yaw, ri === 2 ? TILT.def : 0.3, st);
      if (ri !== 2) { ctx.fillStyle = '#8fb6c8'; ctx.textAlign = 'center'; ctx.fillText(SHOW_L[gi], sx, gy + 15); }
    });
    y += rh;
  });
}

// ---------------------------------------------------------------------
function render(T) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  liveCount = 0;
  if (mode === 'show') { drawShow(T); return; }
  drawWorld();
  const list = zs.slice();
  if (mode === 'def') { for (const s of sols) list.push(s); list.push({ z: cam.zw, wall: true }); }
  list.sort((a, b) => b.z - a.z);
  for (const e of list) {
    if (e.wall) drawWall();
    else if (e.ti !== undefined) drawZombie(e);
    else drawSoldier(e);
  }
  drawFx();
  if (mode === 'fps') drawFpsOverlay(T);
  if (mode === 'def') {
    const bw = Math.min(220, W * 0.5), bx = (W - bw) / 2, by = 10;
    ctx.fillStyle = '#0a1018'; ctx.fillRect(bx, by, bw, 8);
    ctx.fillStyle = wallHP > 40 ? '#4ff0ff' : '#ff5a4a'; ctx.fillRect(bx, by, bw * wallHP / 100, 8);
    ctx.strokeStyle = '#2a4a5a'; ctx.strokeRect(bx, by, bw, 8);
  }
}

function hitTest(px, py) {
  let best = null;
  for (const o of zs) {
    const [sx, gy, sc] = scr(o.x, o.z);
    if (fogAt(o.z) < 0.1) continue;
    if (px > sx - 0.38 * sc && px < sx + 0.38 * sc && py > gy - 1.95 * sc && py < gy && (!best || o.z < best.z)) best = o;
  }
  return best;
}
cv.addEventListener('pointerdown', e => {
  if (mode === 'show') return;
  if (mode === 'fps') { aim = [e.clientX, e.clientY]; gunKick = 1; }
  const o = hitTest(e.clientX, e.clientY);
  if (o) kill(o);
});

// ---------------------------------------------------------------------
// UI
// ---------------------------------------------------------------------
const $ = id => document.getElementById(id);
function setMode(m) {
  mode = m; setupCamera(); initEntities();
  document.querySelectorAll('[data-m]').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  $('bYaw').classList.toggle('hide', m !== 'show');
  $('bState').classList.toggle('hide', m !== 'show');
  $('bNum').classList.toggle('hide', m === 'show');
  $('bShoot').classList.toggle('hide', m !== 'def');
  if (m !== 'show') { const t = TILT[m]; for (let i = 0; i < 7; i++) { getSet(i, t, 'walk'); getSet(i, t, 'claw'); } if (m === 'def') { getSet(T_SOL, t, 'aim'); getSet(T_SOL, t, 'walk'); } }
  else for (const ti of SHOW) { getSet(ti, TILT.def, 'walk'); getSet(ti, TILT.def, ti === T_SOL ? 'aim' : 'claw'); }
}
document.querySelectorAll('[data-m]').forEach(b => b.addEventListener('click', () => setMode(b.dataset.m)));
$('bYaw').onclick = () => { yawIdx = (yawIdx + 1) % YAWS.length; $('bYaw').textContent = '向き:' + YAWS[yawIdx][1]; };
$('bState').onclick = () => { showState = showState === 'walk' ? 'claw' : 'walk'; $('bState').textContent = '動き:' + (showState === 'walk' ? '歩く' : '襲う'); };
$('bNum').onclick = () => { presetIdx = (presetIdx + 1) % 3; $('bNum').textContent = '数:' + PRESET_NAME[presetIdx]; initEntities(); };
$('bShoot').onclick = () => { autoShoot = !autoShoot; $('bShoot').textContent = '自動射撃:' + (autoShoot ? 'ON' : 'OFF'); };

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1); Rig.cdpr = Math.min(DPR, 1.5);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  setupCamera();
}
window.addEventListener('resize', resize);

let last = performance.now(), T = 0, fpsS = 60, msS = 0, hudT = 0;
const stats = { fps: 0, ms: 0 };
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; T += dt;
  const t0 = performance.now();
  update(dt, T); render(T);
  const ms = performance.now() - t0;
  fpsS += (1 / Math.max(dt, 1e-3) - fpsS) * 0.05; msS += (ms - msS) * 0.05;
  stats.fps = fpsS; stats.ms = msS;
  if ((hudT -= dt) <= 0) {
    hudT = 0.25;
    const L = [`${fpsS.toFixed(0)} fps   描画 ${msS.toFixed(1)} ms`];
    if (mode === 'def') L.push(`ゾンビ ${zs.length}  兵士 ${sols.length}  撃破 ${kills}  壁際 ${clawing}`, 'ゾンビをタップ → 弾ける');
    if (mode === 'fps') L.push(`ゾンビ ${zs.length}  撃破 ${kills}  近景(毎フレーム描画) ${liveCount}`, 'タップで撃つ');
    if (mode === 'show') L.push('上2段＝毎フレーム描画 / 下＝実寸の貼り付け');
    L.push(`キャッシュ ${Rig.cacheFrames} 枚`);
    $('hud').textContent = L.join('\n');
  }
  requestAnimationFrame(frame);
}
resize(); setMode('show');
window.__zt = { stats, get mode() { return mode; }, setMode, get counts() { return { zs: zs.length, sols: sols.length, kills, cacheFrames: Rig.cacheFrames, liveCount, particles: particles.length }; } };
requestAnimationFrame(frame);
</script>
</body>
</html>
