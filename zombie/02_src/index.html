<style>

#fps{position:fixed;right:10px;bottom:calc(8px + env(safe-area-inset-bottom));font-size:11px;color:#9cc7d6;pointer-events:none;text-shadow:0 0 3px #000}

<script>
'use strict';
// =====================================================================
// NIGHT WALL（仮）試作 v0.4 — 一人称だけに絞った版
//   夜：壁の上から狙って撃つ（頭は3倍）。場面は 道路 → 市街地 → 森 の順にくり返す。
//     道路   ：遠くから大勢が迫る。
//     市街地 ：横の路地から急に出てくる。飛びかかってくる個体がいる。
//     森     ：霧が濃く、木が弾をさえぎる。
//   合間：装備の画面で銃を買い替え、壁を直す。5の倍数の WAVE は BOSS の夜。
// 人型は rig.js、銃は guns.js。v0.3（拠点・留守番つき）は base-v03.html に残してある。
// =====================================================================
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
const { TYPES, T_FAT, T_RUN, T_SHD, T_BOSS } = Rig;
const GUNS = Guns.DATA, GUN_ORDER = Guns.ORDER;
const TILT_N = 0.1, CT = Math.cos(TILT_N), ST = Math.sin(TILT_N);
function seeded(seed) { let s = seed >>> 0; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }

// ---------------------------------------------------------------------
// 保存
// ---------------------------------------------------------------------
const SAVE_KEY = 'nightwall_proto_v2';
const DEF = { wave: 1, coins: 0, guns: ['pistol'], gun: 'pistol', lv: { wall: 0, ally: 0 }, wallHP: 100, best: 1, mute: false };
function load() {
  try { const o = JSON.parse(localStorage.getItem(SAVE_KEY)); if (o && o.lv && Array.isArray(o.guns)) return Object.assign({}, DEF, o, { lv: Object.assign({}, DEF.lv, o.lv) }); } catch (e) {}
  return JSON.parse(JSON.stringify(DEF));
}
let sv = load();
const persist = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(sv)); } catch (e) {} };

const UP = {
  wall: { name: '壁を強化', base: 35, g: 1.5,  max: 12, desc: l => `耐久 ${100 + 50 * l}→${150 + 50 * l}` },
  ally: { name: '仲間',     base: 60, g: 1.55, max: 8,  desc: l => `${l}→${l + 1}人が援護` },
};
const cost = k => Math.round(UP[k].base * Math.pow(UP[k].g, sv.lv[k]));
const St = { get wallMax() { return 100 + 50 * sv.lv.wall; }, get allies() { return sv.lv.ally; }, get allyDmg() { return 1 + Math.floor(sv.wave / 4); } };

// ---------------------------------------------------------------------
// 場面と波
// ---------------------------------------------------------------------
const SCN = {
  road:   { name: '道路',   fogA: 18, fogB: 42, zN: 27, zF: 41, xr: 3.2, fog: [22, 28, 56] },
  city:   { name: '市街地', fogA: 15, fogB: 40, zN: 27, zF: 38, xr: 2.1, fog: [34, 22, 36] },
  forest: { name: '森',     fogA: 8,  fogB: 27, zN: 20, zF: 26, xr: 4.0, fog: [14, 30, 26] },
};
const placeOf = w => ['road', 'city', 'forest'][(w - 1) % 3];
const waveCfg = w => {
  const boss = w % 5 === 0, hp = 2 + Math.floor((w - 1) / 2), pl = placeOf(w);
  return {
    place: pl, boss, count: boss ? Math.round((8 + 4 * w) * 0.6) : 8 + 4 * w, hp,
    fat: w < 2 ? 0 : Math.min(0.25, 0.06 * (w - 1)),
    run: pl === 'city' || w < 3 ? 0 : Math.min(0.25, 0.08 * (w - 2)),
    leap: pl === 'city' ? Math.min(0.3, 0.14 + 0.02 * w) : 0,
    shd: w < 5 ? 0 : Math.min(0.2, 0.06 * (w - 4)),
    alley: pl === 'city' ? 0.55 : 0,
    sm: 1.4 + 0.04 * w, gap: Math.max(0.35, 1.5 - 0.09 * w), claw: 4 * (1 + 0.06 * (w - 1)), bonus: 20 + 5 * w,
    bossHP: Math.round(90 * hp * Math.sqrt(w / 5)), bossCoin: 100 + 20 * w, slam: 28 + 4 * w, pounce: 10 + 2 * w
  };
};
// 種類ごとの倍率：体力（波の基準に掛ける）・速さ・コイン
const KIND = {
  norm: { hp: 1,   spd: 1,   coin: 5 },
  fat:  { hp: 4,   spd: 0.7, coin: 15 },
  run:  { hp: 0.5, spd: 0.8, coin: 8 },    // 細くて速い
  leap: { hp: 0.5, spd: 0.8, coin: 10 },   // 走ってきて、壁の手前から飛びかかる
  shd:  { hp: 1.5, spd: 0.8, coin: 12 },   // 盾：胴は 1/4 しか通らない。頭は通る
  boss: { hp: 0,   spd: 1,   coin: 0 },
};
const SHIELD_PASS = 0.25, BOSS_SCALE = 2.3, BOSS_SLAM = 1.4, LEAP_TIME = 0.75;
// 市街地：壁の位置、建物の区切り、路地（ゾンビが出てくる所）
const WX = 3.0, SEG = [[2.4, 9.2], [10.8, 13.2], [14.8, 18.2], [19.8, 24.2], [25.8, 60]], ALLEY = [10, 14, 19, 25];

// ---------------------------------------------------------------------
// 音（Web Audio の合成だけ）
// ---------------------------------------------------------------------
let AC = null, noiseBuf = null;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function noise(dur, freq, vol, type = 'bandpass', q = 1, delay = 0) {
  if (sv.mute || !AC) return; const t = AC.currentTime + delay;
  const s = AC.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
  const f = AC.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f).connect(g).connect(AC.destination); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
}
function tone(f0, f1, dur, vol, type = 'sine', delay = 0) {
  if (sv.mute || !AC) return; const t = AC.currentTime + delay;
  const o = AC.createOscillator(); o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + 0.02);
}
const SHOT = {   // 銃ごとの発砲音
  pistol()  { noise(0.07, 2200, 0.3, 'bandpass', 0.7); tone(230, 70, 0.07, 0.25, 'triangle'); },
  magnum()  { noise(0.18, 900, 0.5, 'bandpass', 0.5); tone(150, 35, 0.22, 0.45, 'triangle'); noise(0.3, 300, 0.15, 'lowpass', 1, 0.05); },
  auto()    { noise(0.05, 2600, 0.24, 'bandpass', 0.8); tone(260, 90, 0.05, 0.18, 'triangle'); },
  shotgun() { noise(0.24, 700, 0.6, 'bandpass', 0.4); tone(120, 30, 0.25, 0.45, 'triangle'); tone(700, 500, 0.04, 0.1, 'square', 0.3); tone(500, 800, 0.04, 0.1, 'square', 0.42); },
  rifle()   { noise(0.09, 1700, 0.35, 'bandpass', 0.7); tone(190, 55, 0.09, 0.3, 'triangle'); },
  mg()      { noise(0.07, 1400, 0.33, 'bandpass', 0.6); tone(170, 60, 0.07, 0.3, 'triangle'); },
  at()      { noise(0.45, 400, 0.8, 'lowpass', 0.5); tone(90, 20, 0.5, 0.6, 'sine'); noise(0.5, 1200, 0.2, 'bandpass', 0.5, 0.12); },
};
const sfx = {
  ally() { noise(0.05, 2400, 0.08, 'bandpass', 1); },
  hit() { noise(0.05, 500, 0.25, 'lowpass'); },
  head() { tone(880, 1500, 0.09, 0.16, 'triangle'); },
  kill() { noise(0.2, 380, 0.35, 'lowpass'); tone(130, 45, 0.18, 0.22, 'sawtooth'); },
  wall() { tone(75, 48, 0.13, 0.22, 'square'); noise(0.06, 250, 0.18, 'lowpass'); },
  wood() { noise(0.06, 900, 0.22, 'bandpass', 2); tone(240, 160, 0.05, 0.12, 'square'); },
  reload() { tone(700, 500, 0.04, 0.12, 'square'); tone(500, 900, 0.05, 0.12, 'square', 0.16); },
  swap() { tone(420, 300, 0.05, 0.1, 'square'); tone(300, 520, 0.05, 0.1, 'square', 0.12); },
  buy() { tone(660, 990, 0.1, 0.15, 'triangle'); tone(990, 1320, 0.1, 0.12, 'triangle', 0.08); },
  no() { tone(180, 120, 0.12, 0.12, 'square'); },
  clear() { [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.22, 0.14, 'triangle', i * 0.11)); },
  over() { [330, 262, 196, 131].forEach((f, i) => tone(f, f * 0.96, 0.3, 0.16, 'sawtooth', i * 0.16)); },
  groan() { tone(rnd(85, 120), rnd(60, 80), rnd(0.5, 0.9), 0.07, 'sawtooth'); },
  screech() { tone(520, 900, 0.25, 0.14, 'sawtooth'); tone(900, 300, 0.3, 0.1, 'square', 0.2); },
  clang() { tone(1900, 1300, 0.06, 0.12, 'square'); noise(0.05, 4000, 0.12, 'highpass'); },
  roar() { tone(70, 38, 1.1, 0.3, 'sawtooth'); tone(105, 52, 1.0, 0.18, 'square'); noise(0.9, 300, 0.2, 'lowpass'); },
  slam() { tone(60, 28, 0.35, 0.4, 'sine'); noise(0.25, 180, 0.4, 'lowpass'); },
  bossDie() { tone(90, 25, 1.2, 0.35, 'sawtooth'); noise(0.8, 500, 0.35, 'lowpass'); [392, 523, 659, 784].forEach((f, i) => tone(f, f, 0.25, 0.12, 'triangle', 0.5 + i * 0.1)); },
};
const lastSfx = {};
function sfxT(name, gap = 0.07) { const n = performance.now() / 1000; if (n - (lastSfx[name] || 0) < gap) return; lastSfx[name] = n; sfx[name](); }

// ---------------------------------------------------------------------
// カメラ（壁の上、目の高さ）
// ---------------------------------------------------------------------
let scene = 'title', place = 'road', S = SCN.road;
const cam = {};
let viewKick = 0;
function setupCamera() { cam.cx = W / 2; cam.hy = 0.42 * H; cam.F = 0.62 * H; cam.Hc = 2.0; }
const horizon = () => cam.hy - viewKick * 5;
const scr = (x, z) => [cam.cx + cam.F * x / z, horizon() + cam.F * cam.Hc / z, cam.F / z];
const scr3 = (x, z, h) => [cam.cx + cam.F * x / z, horizon() + cam.F * (cam.Hc - h) / z];
const fogAt = z => clamp((S.fogB - z) / (S.fogB - S.fogA), 0, 1);
function fogMix(c, z) { const k = fogAt(z), f = S.fog; return `rgb(${(c[0] * k + f[0] * (1 - k)) | 0},${(c[1] * k + f[1] * (1 - k)) | 0},${(c[2] * k + f[2] * (1 - k)) | 0})`; }
function fillPoly(pts, col) { ctx.fillStyle = col; ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); ctx.fill(); }
function quad(x0, x1, z0, z1, col) { fillPoly([scr(x0, z0), scr(x1, z0), scr(x1, z1), scr(x0, z1)], col); }

// 場面の飾り（建物・木）は、波の番号を種にして毎回同じ並びにする
let trees = [], blds = [[], []], pines = [];
const skyline = []; { const r = seeded(7); for (let x = 0; x < 1;) { const w = 0.02 + r() * 0.05; skyline.push({ x, w, h: 0.01 + r() * 0.06, lit: r() }); x += w + r() * 0.01; } }
function setupPlace(pl, seed) {
  place = pl; S = SCN[pl];
  const r = seeded(seed * 97 + 13);
  trees = []; blds = [[], []];
  if (pl === 'forest') {
    for (let i = 0; i < 17; i++) {
      const z = 3.4 + i * 1.45 + r() * 0.9, half = 0.38 * z + 0.3;
      let x = (r() * 2 - 1) * Math.min(5.5, half);
      if (z < 7 && Math.abs(x) < 0.75) x = (x < 0 ? -1 : 1) * (0.75 + r() * 0.4);   // 手前の真ん中は空けておく
      trees.push({ x, z, r: 0.2 + r() * 0.2, tone: 0.75 + r() * 0.5, tree: true });
    }
    pines = []; for (let x = -0.05; x < 1.05;) { const w = 0.03 + r() * 0.05; pines.push({ x, w, h: 0.06 + r() * 0.12 }); x += w * 0.6; }
  }
  if (pl === 'city') for (const side of [0, 1]) for (const [z0, z1] of SEG) {
    const b = { h: 8 + r() * 7, col: [38 + r() * 26, 36 + r() * 20, 46 + r() * 24], win: [], door: [], sign: [] };
    b.end = [b.col[0] * 0.7, b.col[1] * 0.7, b.col[2] * 0.75];
    for (let z = z0 + 0.6; z < Math.min(z1, 36) - 1.3; z += 1.8) {
      for (const h of [3.3, 6.1, 8.9, 11.7]) if (h + 1.5 < b.h) { const k = r(); b.win.push({ z, h, col: k < 0.22 ? [255, 196, 110] : k < 0.3 ? [120, 220, 255] : [10, 12, 20] }); }
      if (r() < 0.5) b.door.push(z);
      if (r() < 0.3) b.sign.push({ z, col: ['#ff4fa8', '#4fe8ff', '#ffe04f'][(r() * 3) | 0] });
    }
    blds[side].push(b);
  }
}

// ---------------------------------------------------------------------
// 背景
// ---------------------------------------------------------------------
function drawSky(top, bottom, moon) {
  const hy = horizon(), sky = ctx.createLinearGradient(0, 0, 0, hy);
  sky.addColorStop(0, top); sky.addColorStop(1, bottom);
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, hy + 1);
  if (moon) {
    const mx = W * 0.78, my = hy * 0.3, mr = Math.min(W, H) * 0.045;
    const g = ctx.createRadialGradient(mx, my, mr * 0.5, mx, my, mr * 4); g.addColorStop(0, 'rgba(200,220,255,0.35)'); g.addColorStop(1, 'rgba(200,220,255,0)');
    ctx.fillStyle = g; ctx.fillRect(mx - mr * 4, my - mr * 4, mr * 8, mr * 8);
    ctx.fillStyle = '#dfe8ff'; ctx.beginPath(); ctx.arc(mx, my, mr, 0, TAU); ctx.fill();
  }
}
function drawHaze(col) {
  const hy = horizon(), hz = ctx.createLinearGradient(0, hy, 0, hy + 0.12 * H);
  hz.addColorStop(0, `rgba(${col},0.92)`); hz.addColorStop(1, `rgba(${col},0)`);
  ctx.fillStyle = hz; ctx.fillRect(0, hy, W, 0.12 * H);
}
function drawRoad() {
  const hy = horizon();
  drawSky('#02030a', '#161c38', true);
  for (const b of skyline) {
    const bh = b.h * H; ctx.fillStyle = '#0a0d1b'; ctx.fillRect(b.x * W, hy - bh, b.w * W, bh);
    if (b.lit > 0.6) { ctx.fillStyle = 'rgba(255,190,90,0.35)'; ctx.fillRect(b.x * W + b.w * W * 0.3, hy - bh * 0.7, 2, 2); }
  }
  ctx.fillStyle = '#07090f'; ctx.fillRect(0, hy, W, H - hy);
  quad(-7, 7, 0.3, 400, '#10141d');
  for (let z = 1; z < 120; z += 6) { const a = 1 - z / 120; quad(-2.4, -2.25, z, z + 3, `rgba(150,165,190,${0.35 * a})`); quad(2.25, 2.4, z, z + 3, `rgba(150,165,190,${0.35 * a})`); }
  quad(-7.1, -6.9, 0.3, 400, 'rgba(255,60,200,0.55)'); quad(6.9, 7.1, 0.3, 400, 'rgba(60,230,255,0.55)');
  for (let z = 2; z < 110; z += 6) for (const x of [-7.7, 7.7]) {
    const [sx, gy, sc] = scr(x, z);
    ctx.strokeStyle = `rgba(80,230,255,${0.6 * fogAt(z)})`; ctx.lineWidth = Math.max(1, 0.08 * sc);
    ctx.beginPath(); ctx.moveTo(sx, gy); ctx.lineTo(sx, gy - 0.9 * sc); ctx.stroke();

    $('bNext').onclick = () => { sv.wallHP = Math.round(St.wallMax * 0.3); persist(); setScene('shop'); };
  }
}
function updateHud() {
  const w = scene === 'clear' ? sv.wave - 1 : sv.wave;
  $('hWave').textContent = `WAVE ${w}・${SCN[cfg.place].name}`;
  $('hLeft').textContent = '残り ' + (toSpawn + zs.length);
  $('hCoin').textContent = sv.coins;
  const r = clamp(sv.wallHP / St.wallMax, 0, 1);
  $('wallFill').style.width = (r * 100) + '%'; $('wallFill').style.background = r > 0.4 ? '#4ff0ff' : '#ff5a4a';
  $('wallNum').textContent = Math.ceil(sv.wallHP) + '/' + St.wallMax;
  $('hGun').textContent = G_().name;
  $('hAmmo').textContent = reloadT > 0 ? '装填中…' : (ammoOf[sv.gun] ?? G_().mag) + ' / ' + G_().mag;
  $('bReload').disabled = reloadT > 0 || (ammoOf[sv.gun] ?? 0) >= G_().mag;
  $('bSwap').classList.toggle('hide', sv.guns.length < 2);
}
$('bReload').onclick = () => startReload();
$('bSwap').onclick = () => swapGun();
const muteLabel = () => { $('bMute').textContent = sv.mute ? '♪ OFF' : '♪ ON'; };
$('bMute').onclick = () => { sv.mute = !sv.mute; persist(); muteLabel(); audio(); };
muteLabel();

// 狙い：押している間は連射。タッチは指で隠れないよう少し上を狙う
function setAim(e) { aim = [clamp(e.clientX, 0, W), clamp(e.clientY - (e.pointerType === 'touch' ? 56 : 0), 0, H)]; }
cv.addEventListener('pointerdown', e => { audio(); if (scene !== 'night') return; setAim(e); aiming = true; try { cv.setPointerCapture(e.pointerId); } catch (_) {} });
cv.addEventListener('pointermove', e => { if (scene === 'night' && (aiming || e.pointerType === 'mouse')) setAim(e); });
const stopAim = () => { aiming = false; };
cv.addEventListener('pointerup', stopAim); cv.addEventListener('pointercancel', stopAim);
window.addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R') startReload();
  if (e.key === 'q' || e.key === 'Q' || e.key === 'Tab') { e.preventDefault(); swapGun(); }
  const n = +e.key; if (scene === 'night' && n >= 1 && n <= 7 && sv.guns.includes(GUN_ORDER[n - 1]) && sv.gun !== GUN_ORDER[n - 1]) { sv.gun = GUN_ORDER[n - 1]; reloadT = 0; swapT = 0.35; heat = 0; sfx.swap(); persist(); updateHud(); }
});

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1); Rig.cdpr = Math.min(DPR, 1.5);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); cv.style.width = W + 'px'; cv.style.height = H + 'px';
  setupCamera();
}
window.addEventListener('resize', resize);
window.addEventListener('contextmenu', e => e.preventDefault());   // 長押しのメニューを出さない
const SHOW_FPS = /[?&]fps/.test(location.search);   // 末尾に ?fps を付けると速さを表示
if (SHOW_FPS) $('fps').classList.remove('hide');

let last = performance.now(), T = 0, hudT = 0, msS = 0, fpsS = 60;
function step(dt) {
  T += dt;
  if (scene === 'night') { updateWorld(dt, T); updateNight(dt); }
  else if (scene !== 'shop') updateWorld(dt, T);
}
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const t0 = performance.now();
  step(dt);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (scene === 'shop') renderShop(T); else renderNight(T);
  msS += (performance.now() - t0 - msS) * 0.05;
  fpsS += (1 / Math.max(dt, 1e-3) - fpsS) * 0.05;
  if ((hudT -= dt) <= 0) { hudT = 0.1; if (scene === 'night') updateHud(); if (SHOW_FPS) $('fps').textContent = `${fpsS.toFixed(0)} fps・描画 ${msS.toFixed(1)} ms`; }
  requestAnimationFrame(frame);
}
resize(); setScene('title');
// 確認用（テストとデバッグ）
window.__g = {
  get scene() { return scene; }, get place() { return place; }, get sv() { return sv; }, get zs() { return zs; }, get trees() { return trees; }, get ms() { return msS; },
  get night() { return { toSpawn, alive: zs.length, ammo: ammoOf[sv.gun], reloadT, earned, killsN, headsN, clawing, wall: sv.wallHP, heat }; },
  step, startNight, setScene, hitAll, treeAt, zscr, fire, swapGun, setAim: (x, y) => { aim = [x, y]; }, hold: v => { aiming = v; },
  coins: n => { sv.coins += n; if (scene === 'shop') renderPanel(); }, St, cost, waveCfg, GUNS, placeOf
};
requestAnimationFrame(frame);
</script>
</body>
</html>
