<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LANDER タイトル曲 試聴</title>
<style>
:root{--bg:#06080E;--fg:#EFE9DA;--dim:#8d958f;--teal:#3FD0C0;--line:#1b242b;--card:#0c1218}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:18px;letter-spacing:.12em;margin:8px 0 4px;font-weight:600}
.sub{color:var(--dim);font-size:13px;margin:0 0 18px}
.row{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
.row.on{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal) inset}
.row.ref{opacity:.92}
.play{flex:none;width:56px;height:56px;border-radius:50%;border:2px solid var(--teal);background:transparent;color:var(--teal);font-size:22px;cursor:pointer}
.row.on .play{background:var(--teal);color:#06080E}
.play:focus-visible,.stop:focus-visible,input:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.t{font-weight:600}.badge{font-size:12px;color:var(--teal);margin-left:8px;display:none}
.row.on .badge{display:inline}
.d{color:var(--dim);font-size:13px;margin:4px 0 0}
.bar{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 20%);padding:16px 0 4px;margin-top:12px}
.ctl{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.stop{min-height:48px;padding:0 22px;border-radius:24px;border:1px solid var(--dim);background:transparent;color:var(--fg);font-size:16px;cursor:pointer}
label{display:flex;gap:10px;align-items:center;flex:1;min-width:200px;color:var(--dim);font-size:13px}
input[type=range]{flex:1;height:36px;accent-color:var(--teal)}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:10px}
.meter i{display:block;height:100%;width:0;background:var(--teal)}
.st{color:var(--dim);font-size:12px;margin-top:6px;min-height:1.4em}
</style>
</head>
<body>
<main>
<h1>LANDER タイトル曲 試聴</h1>
<p class="sub">ゲーム本体は変更していません。▶ で再生、別の▶ を押すと切り替わります。F基準・7/8拍子(2+2+3)。イヤホン推奨。</p>
<div id="rows"></div>
<div class="bar">
 <div class="ctl">
  <button class="stop" id="stop">■ STOP</button>
  <label>音量 <input type="range" id="vol" min="0" max="1" step="0.01" value="0.8" aria-label="マスター音量"></label>
 </div>
 <div class="meter"><i id="mt"></i></div>
 <div class="st" id="st">停止中</div>
</div>
</main>
<script type="module">
import { Music } from '../02_src/music.js';
import { CANDIDATES } from './title_candidates.js';
import { createCandidate } from './title_candidates.js';

const ITEMS = [
  { id: 'ref-title', label: '現在のタイトル曲（参考）', ref: true, desc: 'ゲーム本体の実物 Music.playTitle()。Aルートのノコギリ波ドローン+ローパスLFO+長調ペンタのベル+ディレイ。重厚。' },
  { id: 'ref-jingle', label: '成功ジングル（参考）', ref: true, desc: 'ゲーム本体の実物 Music.playJingle({tier:0, perfect:false})。7/8(2+2+3)・Fリディアン・ドミナント・25%パルス。' },
  ...CANDIDATES.map((c) => ({ id: c.id, label: c.label, desc: c.desc })),
];
const rowsEl = document.getElementById('rows');
const els = {};
for (const it of ITEMS) {
  const r = document.createElement('div'); r.className = 'row' + (it.ref ? ' ref' : '');
  r.innerHTML = '<button class="play" aria-label="再生"></button><div><div class="t"></div><div class="d"></div></div>';
  r.querySelector('.play').textContent = '▶';
  r.querySelector('.t').innerHTML = '<span></span><span class="badge">再生中</span>';
  r.querySelector('.t span').textContent = it.label;
  r.querySelector('.d').textContent = it.desc;
  r.querySelector('.play').addEventListener('click', () => start(it.id));
  rowsEl.appendChild(r); els[it.id] = r;
}

let ctx = null, master = null, comp = null, analyser = null, proxy = null;
let cur = null;                // {id, h?}
const dying = [];
let t0 = 0;
const stEl = document.getElementById('st'), mtEl = document.getElementById('mt'), volEl = document.getElementById('vol');

function ensure() {
  if (!ctx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = +volEl.value;
    comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.knee.value = 12; comp.ratio.value = 6; comp.attack.value = 0.003; comp.release.value = 0.25;
    analyser = ctx.createAnalyser(); analyser.fftSize = 1024;
    master.connect(comp); comp.connect(analyser); analyser.connect(ctx.destination);
    // 参考曲(Music)の出力を同じマスターへ通す: destination だけ差し替えたラッパ
    proxy = new Proxy(ctx, { get(t, p) { if (p === 'destination') return master; const v = t[p]; return typeof v === 'function' ? v.bind(t) : v; } });
    Music.attach({ ctx: proxy, enabled: true });
  }
  if (ctx.state !== 'running') ctx.resume();
}
function stopCur(fade = 0.3) {
  if (!cur) return;
  if (cur.id.startsWith('ref-')) { Music.stopAll(fade); Music.stopJingle(fade); }
  else { cur.h.stop(fade); dying.push(cur.h); }
  els[cur.id].classList.remove('on'); els[cur.id].querySelector('.play').textContent = '▶';
  cur = null;
}
function start(id) {
  ensure();
  if (cur && cur.id === id) { stopCur(); setStatus(); return; }   // 同じ行をもう一度押すと停止
  stopCur();
  if (id === 'ref-title') Music.playTitle();
  else if (id === 'ref-jingle') Music.playJingle({ tier: 0, perfect: false });
  else cur = { id, h: createCandidate(id, ctx, master) };
  if (!cur) cur = { id };
  t0 = performance.now();
  els[id].classList.add('on'); els[id].querySelector('.play').textContent = '■';
  setStatus();
}
function setStatus() {
  if (!cur) { stEl.textContent = '停止中'; return; }
  const s = Math.floor((performance.now() - t0) / 1000);
  stEl.textContent = '再生中: ' + ITEMS.find((i) => i.id === cur.id).label + '  ' + Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}
document.getElementById('stop').addEventListener('click', () => { stopCur(); setStatus(); });
volEl.addEventListener('input', () => { if (master) master.gain.setTargetAtTime(+volEl.value, ctx.currentTime, 0.02); });

setInterval(() => {   // タブが隠れても止まらないよう setInterval で駆動
  if (!ctx) return;
  Music.tick(0.025);
  if (cur && cur.h) cur.h.tick();
  for (let i = dying.length - 1; i >= 0; i--) { dying[i].tick(); if (dying[i].done) dying.splice(i, 1); }
}, 25);
const buf = new Float32Array(1024);
(function frame() {
  if (analyser && cur) {
    analyser.getFloatTimeDomainData(buf);
    let p = 0; for (let i = 0; i < buf.length; i++) p = Math.max(p, Math.abs(buf[i]));
    mtEl.style.width = Math.min(100, p * 100) + '%';
  } else mtEl.style.width = '0';
  if (cur) setStatus();
  requestAnimationFrame(frame);
})();
window.__lab = { Music, get ctx() { return ctx; }, ITEMS };
</script>
</body>
</html>
