<!DOCTYPE html>
<html>

<head>
    <title>Five Elements Life Game — Installation</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            overflow: hidden;
            background-color: #111;
            color: #eee;
            width: 100vw;
            height: 100vh;
            cursor: none;               /* gallery mode: hide the pointer */
        }

        body.ui-visible {
            cursor: auto;               /* pointer returns when controls are shown */
        }

        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #111;
        }

        /* Installation mode: the gear stays faintly visible at all times as a
           discreet toggle. Click it (or press H) to reveal/hide the panels.
           The pointer only appears when hovering the gear itself. */
        #ui-toggle {
            position: absolute;
            bottom: 15px;
            right: 15px;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1000;
            opacity: 0.16;
            transition: opacity 0.35s ease, transform 0.2s ease;
            background: none;
            border-radius: 0;
            box-shadow: none;
            border: none;
        }

        body.ui-visible #ui-toggle {
            opacity: 0.9;
        }

        #ui-toggle:hover {
            transform: scale(1.1);
            opacity: 0.9;
        }

        #ui-toggle svg {
            width: 25px;
            height: 25px;
            fill: rgba(180, 180, 180, 0.7);
            transition: fill 0.2s ease;
            filter: drop-shadow(0 0 2px rgba(0, 0, 0, 0.5));
        }

        #ui-toggle:hover svg {
            fill: rgba(220, 220, 220, 0.9);
        }

        #controls-panel {
            position: absolute;
            bottom: 80px;
            right: 20px;
            background-color: rgba(40, 40, 40, 0.85);
            border-radius: 10px;
            padding: 15px;
            width: 280px;
            display: none;
            flex-direction: column;
            gap: 15px;
            z-index: 900;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.6);
            max-height: 80vh;
            overflow-y: auto;
        }

        body.ui-visible #controls-panel {
            display: flex;
        }

        .control-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .buttons-row {
            display: flex;
            gap: 10px;
            justify-content: space-between;
        }

        button {
            background-color: #444;
            color: #eee;
            border: none;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 14px;
            border-radius: 5px;
            flex: 1;
            transition: background-color 0.2s ease;
        }

        button:hover {
            background-color: #666;
        }

        button.active {
            background-color: #2a6c8f;
        }

        input[type="range"] {
            width: 150px;
            accent-color: #2a6c8f;
        }

        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background-color: rgba(40, 40, 40, 0.7);
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            max-width: 250px;
            backdrop-filter: blur(3px);
            transition: opacity 0.3s ease;
            display: none;
        }

        body.ui-visible #info-panel {
            display: block;
        }

        .info-row {
            margin-bottom: 5px;
        }

        .population-bar {
            height: 8px;
            border-radius: 4px;
            margin-top: 2px;
            display: flex;
        }

        .population-segment {
            height: 100%;
        }

        #seasonDisplay {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .section-header {
            font-weight: bold;
            margin-top: 5px;
            margin-bottom: 10px;
            border-bottom: 1px solid #666;
            padding-bottom: 5px;
        }

        select {
            background-color: #333;
            color: #eee;
            border: none;
            padding: 5px;
            border-radius: 4px;
            width: 150px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
        }

        .checkbox-group input[type="checkbox"] {
            margin-right: 5px;
        }

        .opacity-toggle {
            transition: transform 0.2s ease;
        }

        .opacity-toggle:hover {
            transform: scale(1.1);
        }
    </style>
</head>

<body>
    <div id="container">
        <canvas id="lifeCanvas"></canvas>
        <div id="info-panel">
            <div class="info-row" id="seasonDisplay">Season: Spring (Wood)</div>
            <div class="info-row" id="turnCounter">Turn: 0</div>
            <div class="info-row" id="virusCount">Viruses: 0</div>
            <div class="info-row">Population:</div>
            <div id="populationBars"></div>
        </div>

        <div id="ui-toggle">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12,15.5c1.9,0,3.5-1.6,3.5-3.5s-1.6-3.5-3.5-3.5S8.5,10.1,8.5,12S10.1,15.5,12,15.5z M20,11h-2.3
                    c-0.2-0.8-0.5-1.5-1-2.1l1.6-1.6l-1.4-1.4l-1.6,1.6C14.5,7,13.8,6.7,13,6.5V4h-2v2.5c-0.8,0.2-1.5,0.5-2.1,1l-1.6-1.6
                    l-1.4,1.4l1.6,1.6c-0.5,0.7-0.8,1.4-1,2.1H4v2h2.3c0.2,0.8,0.5,1.5,1,2.1l-1.6,1.6l1.4,1.4l1.6-1.6c0.7,0.5,1.4,0.8,2.1,1
                    V20h2v-2.5c0.8-0.2,1.5-0.5,2.1-1l1.6,1.6l1.4-1.4l-1.6-1.6c0.5-0.7,0.8-1.4,1-2.1H20V11z"/>
            </svg>
        </div>

        <div id="controls-panel">
            <div class="buttons-row">
                <button id="startButton">Start</button>
                <button id="pauseButton">Pause</button>
                <button id="resetButton">Reset</button>
            </div>
            <div class="control-group">
                <label for="speedSlider">Speed:</label>
                <div>
                    <input type="range" id="speedSlider" min="1" max="100" value="5">
                    <span id="speedValue">x5</span>
                </div>
            </div>
            <div class="control-group">
                <label for="cellSizeSlider">Grid Scale:</label>
                <div>
                    <input type="range" id="cellSizeSlider" min="2" max="10" value="5">
                    <span id="cellSizeValue">x5</span>
                </div>
            </div>

            <div class="section-header">Sound Settings</div>
            <div class="control-group">
                <label>Enable Sound:</label>
                <div class="checkbox-group">
                    <input type="checkbox" id="soundToggle" checked>
                </div>
            </div>
            <div class="control-group">
                <label for="soundVolumeSlider">Volume:</label>
                <div>
                    <input type="range" id="soundVolumeSlider" min="0" max="100" value="50">
                    <span id="soundVolumeValue">50%</span>
                </div>
            </div>
            <div class="control-group">
                <label for="waveformSelect">Waveform:</label>
                <div>
                    <select id="waveformSelect">
                        <option value="pure">Pure Sine Wave</option>
                        <option value="mixed">Mixed Waveforms</option>
                        <option value="square">Square Wave</option>
                        <option value="sawtooth">Sawtooth Wave</option>
                        <option value="triangle">Triangle Wave</option>
                    </select>
                </div>
            </div>
            <div class="control-group">
                <label>Modulation:</label>
                <div class="checkbox-group">
                    <input type="checkbox" id="modulationToggle">
                </div>
            </div>
            <div class="control-group">
                <label for="modulationIntensitySlider">Mod Intensity:</label>
                <div>
                    <input type="range" id="modulationIntensitySlider" min="0" max="100" value="50" disabled>
                    <span id="modulationIntensityValue">50%</span>
                </div>
            </div>
            <div class="control-group">
                <label for="modulationRateSlider">Mod Speed:</label>
                <div>
                    <input type="range" id="modulationRateSlider" min="1" max="20" value="5" disabled>
                    <span id="modulationRateValue">5 Hz</span>
                </div>
            </div>
            <div class="buttons-row">
                <button id="testSoundButton">Test Sounds</button>
            </div>

            <div class="section-header">Disaster Settings</div>
            <div class="control-group">
                <label for="disasterFrequencySlider">Occurrence (years):</label>
                <div>
                    <input type="range" id="disasterFrequencySlider" min="1" max="5" value="2" step="1">
                    <span id="disasterFrequencyValue">2</span>
                </div>
            </div>
            <div class="control-group">
                <label for="disasterProbabilitySlider">Probability:</label>
                <div>
                    <input type="range" id="disasterProbabilitySlider" min="0.1" max="1" value="0.8" step="0.1">
                    <span id="disasterProbabilityValue">0.8</span>
                </div>
            </div>
            <div class="control-group">
                <label for="disasterDurationSlider">Duration:</label>
                <div>
                    <input type="range" id="disasterDurationSlider" min="100" max="5000" value="300" step="50">
                    <span id="disasterDurationValue">300</span>
                </div>
            </div>
            <div class="buttons-row">
                <button id="triggerDisasterBtn">Trigger Disaster</button>
            </div>

            <div class="section-header">Settings</div>
            <div class="buttons-row">
                <button id="saveSettingsBtn">Save Settings</button>
            </div>
        </div>
    </div>

    <script>
    // ============================================================================
    // Five Elements Life Game — definitive installation build.
    // Consolidated from five-elements-life-game-sig_sound.js + life-game-improvements.js.
    // UI is hidden by default; press H to reveal/hide the info + controls panels.
    // The simulation auto-starts on load.
    // ============================================================================

    // ---- DOM element references ----
    const canvas = document.getElementById('lifeCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('container');
    const startButton = document.getElementById('startButton');
    const pauseButton = document.getElementById('pauseButton');
    const resetButton = document.getElementById('resetButton');
    const speedSlider = document.getElementById('speedSlider');
    const speedValueDisplay = document.getElementById('speedValue');
    const turnCounterDisplay = document.getElementById('turnCounter');
    const populationBarsDisplay = document.getElementById('populationBars');
    const virusCountDisplay = document.getElementById('virusCount');
    const uiToggle = document.getElementById('ui-toggle');
    const controlsPanel = document.getElementById('controls-panel');
    const cellSizeSlider = document.getElementById('cellSizeSlider');
    const cellSizeValueDisplay = document.getElementById('cellSizeValue');
    const seasonDisplay = document.getElementById('seasonDisplay');

    // ---- Audio state ----
    let audioContext;
    let isAudioInitialized = false;
    let isSoundEnabled = true;
    let soundVolume = 0.5;

    let useModulation = false;
    let modulationIntensity = 0.5;
    let modulationRate = 5;

    // Waveform presets
    const WAVE_PRESETS = {
        pure: {
            wood: { frequency: 1864.66, type: 'sine' },
            fire: { frequency: 2217.46, type: 'sine' },
            earth: { frequency: 2489.02, type: 'sine' },
            metal: { frequency: 2959.96, type: 'sine' },
            water: { frequency: 3322.44, type: 'sine' }
        },
        mixed: {
            wood: { frequency: 1864.66, type: 'sine' },
            fire: { frequency: 2217.46, type: 'sawtooth' },
            earth: { frequency: 2489.02, type: 'triangle' },
            metal: { frequency: 2959.96, type: 'square' },
            water: { frequency: 3322.44, type: 'triangle' }
        },
        square: {
            wood: { frequency: 1864.66, type: 'square' },
            fire: { frequency: 2217.46, type: 'square' },
            earth: { frequency: 2489.02, type: 'square' },
            metal: { frequency: 2959.96, type: 'square' },
            water: { frequency: 3322.44, type: 'square' }
        },
        sawtooth: {
            wood: { frequency: 1864.66, type: 'sawtooth' },
            fire: { frequency: 2217.46, type: 'sawtooth' },
            earth: { frequency: 2489.02, type: 'sawtooth' },
            metal: { frequency: 2959.96, type: 'sawtooth' },
            water: { frequency: 3322.44, type: 'sawtooth' }
        },
        triangle: {
            wood: { frequency: 1864.66, type: 'triangle' },
            fire: { frequency: 2217.46, type: 'triangle' },
            earth: { frequency: 2489.02, type: 'triangle' },
            metal: { frequency: 2959.96, type: 'triangle' },
            water: { frequency: 3322.44, type: 'triangle' }
        }
    };

    let SOUND_PARAMS = WAVE_PRESETS.pure;

    // Randomized detune/pan so sounds feel spatial. (Fixed: previously always returned 0.)
    function getRandomDetune() {
        return (Math.random() * 50) - 25; // roughly +/-25 cents
    }

    function getRandomPan() {
        return (Math.random() * 1.6) - 0.8; // roughly -0.8..0.8
    }

    function initAudio() {
        try {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            isAudioInitialized = true;
        } catch (e) {
            console.error("Web Audio API is not supported in this browser", e);
            isAudioInitialized = false;
        }
    }

    // Basic death-tone player, with an optional modulation envelope.
    function playDeathSound(cellType) {
        if (!isAudioInitialized || !audioContext || !isSoundEnabled) {
            return;
        }

        const params = SOUND_PARAMS[cellType] || SOUND_PARAMS.wood;

        const oscillator = audioContext.createOscillator();
        const gainNode = audioContext.createGain();
        const panNode = audioContext.createStereoPanner();

        panNode.pan.value = useModulation ? getRandomPan() : 0;

        let stopTime;
        if (useModulation) {
            gainNode.gain.setValueAtTime(0.01 * soundVolume, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.2 * soundVolume, audioContext.currentTime + 0.05);
            gainNode.gain.exponentialRampToValueAtTime(0.1 * soundVolume, audioContext.currentTime + 0.2);
            gainNode.gain.exponentialRampToValueAtTime(0.001 * soundVolume, audioContext.currentTime + 0.6);
            stopTime = 0.6;
        } else {
            // Fixed: previously jumped straight to soundVolume with a near-zero ramp
            // and stopped at 50ms, producing an audible click. Now: short attack,
            // then an exponential decay tail, and the oscillator stops after the decay.
            const attackTime = 0.008;
            const decayTime = 0.3;
            gainNode.gain.setValueAtTime(0.0001, audioContext.currentTime);
            gainNode.gain.linearRampToValueAtTime(soundVolume, audioContext.currentTime + attackTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + attackTime + decayTime);
            stopTime = attackTime + decayTime + 0.02;
        }

        oscillator.type = params.type;
        oscillator.frequency.setValueAtTime(params.frequency, audioContext.currentTime);

        if (useModulation) {
            const detune = getRandomDetune() * modulationIntensity * 2;
            oscillator.detune.setValueAtTime(detune, audioContext.currentTime);

            const vibratoAmount = modulationIntensity * 15;
            for (let i = 0; i < 10; i++) {
                const time = audioContext.currentTime + (i * 0.05);
                const vibratoCents = vibratoAmount * Math.sin(time * modulationRate * Math.PI * 2);
                oscillator.detune.linearRampToValueAtTime(detune + vibratoCents, time);
            }
        }

        oscillator.connect(gainNode);
        gainNode.connect(panNode);
        panNode.connect(audioContext.destination);

        oscillator.start();
        oscillator.stop(audioContext.currentTime + stopTime);
    }

    // Multiple slightly-offset tones (jazzy cluster effect).
    function playDeathSoundsCluster(cellType, count = 3) {
        if (!isAudioInitialized || !audioContext || !isSoundEnabled) {
            return;
        }

        const jazzDelays = [0, 30, 70, 120, 180];

        for (let i = 0; i < count; i++) {
            const delay = jazzDelays[i % jazzDelays.length];

            setTimeout(() => {
                // Fixed: Math.random()*1 always floored to index 0, so only the
                // first pitch offset (-1) was ever reachable. Now all five are.
                const pitchShift = [-1, 0, 1, 2, 3][Math.floor(Math.random() * 5)];
                playDeathSoundWithCustomPitch(cellType, pitchShift);
            }, delay);
        }
    }

    function playDeathSoundWithCustomPitch(cellType, pitchShift) {
        if (!isAudioInitialized || !audioContext || !isSoundEnabled) {
            return;
        }

        const params = SOUND_PARAMS[cellType] || SOUND_PARAMS.wood;

        const oscillator = audioContext.createOscillator();
        const gainNode = audioContext.createGain();
        const panNode = audioContext.createStereoPanner();

        panNode.pan.value = getRandomPan();

        gainNode.gain.setValueAtTime(0.01 * soundVolume, audioContext.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01 * soundVolume, audioContext.currentTime + 0.01 + Math.random() * 1);
        gainNode.gain.exponentialRampToValueAtTime(0.001 * soundVolume, audioContext.currentTime + 0.01 + Math.random() * 1);

        oscillator.type = params.type;
        oscillator.frequency.setValueAtTime(params.frequency, audioContext.currentTime);
        oscillator.detune.setValueAtTime(getRandomDetune() + pitchShift, audioContext.currentTime);

        oscillator.connect(gainNode);
        gainNode.connect(panNode);
        panNode.connect(audioContext.destination);

        oscillator.start();
        oscillator.stop(audioContext.currentTime + 0.05 + Math.random() * 0.05);
    }

    // Small chime on season change.
    function playSeasonChangeSound(seasonType) {
        if (!isAudioInitialized || !audioContext || !isSoundEnabled) {
            return;
        }

        const params = SOUND_PARAMS[seasonType] || SOUND_PARAMS.wood;

        const oscillator = audioContext.createOscillator();
        const gainNode = audioContext.createGain();
        const panNode = audioContext.createStereoPanner();

        panNode.pan.value = 0;

        const seasonChangeVolume = soundVolume * 0.1;
        gainNode.gain.setValueAtTime(seasonChangeVolume, audioContext.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(seasonChangeVolume, audioContext.currentTime);

        oscillator.type = params.type;
        oscillator.frequency.setValueAtTime(params.frequency, audioContext.currentTime);

        oscillator.connect(gainNode);
        gainNode.connect(panNode);
        panNode.connect(audioContext.destination);

        oscillator.start();
        oscillator.stop(audioContext.currentTime + 0.05);
    }

    // Plays all five elements in sequence — used by the Test Sounds button.
    function testAllSounds() {
        if (!isAudioInitialized) {
            initAudio();
        }

        if (!isAudioInitialized || !audioContext) {
            return;
        }

        const types = ['wood', 'fire', 'earth', 'metal', 'water'];

        types.forEach((type, index) => {
            setTimeout(() => {
                playDeathSoundsCluster(type, 3);
            }, index * 500);
        });
    }

    // ---- Global simulation state ----
    let BASE_CELL_SIZE = 5;
    let GRID_SIZE_X;
    let GRID_SIZE_Y;
    let CELL_SIZE;
    let grid;
    let turn = 0;
    let isRunning = false;
    let baseInterval = 50;
    let disasterActive = false;
    let disasterTimer = 0;
    let yearTimer = 0;

    let disasterFrequency = 2;
    let disasterProbability = 0.8;
    let disasterDuration = 300;
    let disasterVirusInitialCount = 30;
    let disasterMessage = '';

    let deathSoundCounter = 0;
    let deathSoundThreshold = 10;
    let deathSoundCooldown = 0;

    let lastUpdateTime = 0;
    let updateInterval = 50;
    let animationFrameId = null;
    let infoPanelUpdateCounter = 0;

    let currentSeason = 'wood';
    let seasonTimer = 0;
    let yearTotalTime = 100;
    let seasonTime = 20;
    let lastSeasonUpdateTime = 0;
    let disasterYearCounter = 0;

    const VIRUS_SIZE = 2;
    const CELL_SIZES = {
        wood: 7,
        fire: 4,
        earth: 8,
        metal: 6,
        water: 5
    };

    const VIRUS_TYPES = ['yin', 'yang', 'lethal'];
    const VIRUS_COLORS = {
        yin: '#9370DB',
        yang: '#4682B4',
        lethal: '#FF0000'
    };
    const VIRUS_COUNT = 100;

    const CELL_TYPES = ['wood', 'fire', 'earth', 'metal', 'water'];

    const ELEMENT_SEASONS = {
        wood: 'Spring (Wood)',
        fire: 'Summer (Fire)',
        earth: 'Late Summer (Earth)',
        metal: 'Autumn (Metal)',
        water: 'Winter (Water)'
    };

    const CELL_COLORS = {
        wood: '#66BB6A',
        fire: '#FF5722',
        earth: '#FFC107',
        metal: '#B0BEC5',
        water: '#29B6F6'
    };

    const CELL_SHAPES = { wood: 'rect', fire: 'triangle', earth: 'rect', metal: 'circle', water: 'wave' };
    const CELL_COUNT = 50;

    let entities = [];
    let viruses = [];
    let cells = [];
    let corpses = [];

    const CARRYING_CAPACITY = 10000;

    // ---- Settings persistence ----
    const SETTINGS_KEY = 'fiveElementsGameSettings';

    const defaultSettings = {
        speed: 5,
        cellSize: 5,
        soundEnabled: true,
        soundVolume: 50,
        waveformType: 'pure',
        modulationEnabled: false,
        modulationIntensity: 50,
        modulationRate: 5,
        disasterFrequency: 2,
        disasterProbability: 0.8,
        disasterDuration: 300,
        infoPanelOpacity: 0.7
    };

    function loadSettings() {
        try {
            const savedSettings = localStorage.getItem(SETTINGS_KEY);
            if (savedSettings) {
                const settings = JSON.parse(savedSettings);
                return { ...defaultSettings, ...settings };
            }
        } catch (e) {
            console.error("Error loading settings:", e);
        }
        return { ...defaultSettings };
    }

    function saveSettings() {
        try {
            const settings = {
                speed: parseInt(speedSlider.value),
                cellSize: parseInt(cellSizeSlider.value),
                soundEnabled: isSoundEnabled,
                soundVolume: Math.round(soundVolume * 100),
                waveformType: getSelectedWaveformType(),
                modulationEnabled: useModulation,
                modulationIntensity: Math.round(modulationIntensity * 100),
                modulationRate: modulationRate,
                disasterFrequency: disasterFrequency,
                disasterProbability: disasterProbability,
                disasterDuration: disasterDuration,
                infoPanelOpacity: parseFloat(getComputedStyle(document.getElementById('info-panel')).opacity)
            };

            localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
        } catch (e) {
            console.error("Error saving settings:", e);
        }
    }

    function getSelectedWaveformType() {
        const waveformSelect = document.getElementById('waveformSelect');
        return waveformSelect ? waveformSelect.value : 'pure';
    }

    function applySettings(settings) {
        if (speedSlider) {
            speedSlider.value = settings.speed;
            speedValueDisplay.textContent = `x${settings.speed}`;
            updateInterval = baseInterval / settings.speed;
        }

        if (cellSizeSlider) {
            cellSizeSlider.value = settings.cellSize;
            cellSizeValueDisplay.textContent = `x${settings.cellSize}`;
            BASE_CELL_SIZE = settings.cellSize;
        }

        isSoundEnabled = settings.soundEnabled;
        soundVolume = settings.soundVolume / 100;

        if (document.getElementById('soundToggle')) {
            document.getElementById('soundToggle').checked = settings.soundEnabled;
        }

        if (document.getElementById('soundVolumeSlider')) {
            document.getElementById('soundVolumeSlider').value = settings.soundVolume;
            document.getElementById('soundVolumeValue').textContent = `${settings.soundVolume}%`;
        }

        if (document.getElementById('waveformSelect')) {
            document.getElementById('waveformSelect').value = settings.waveformType;
            SOUND_PARAMS = WAVE_PRESETS[settings.waveformType] || WAVE_PRESETS.pure;
        }

        useModulation = settings.modulationEnabled;
        modulationIntensity = settings.modulationIntensity / 100;
        modulationRate = settings.modulationRate;

        if (document.getElementById('modulationToggle')) {
            document.getElementById('modulationToggle').checked = settings.modulationEnabled;
        }

        if (document.getElementById('modulationIntensitySlider')) {
            document.getElementById('modulationIntensitySlider').value = settings.modulationIntensity;
            document.getElementById('modulationIntensitySlider').disabled = !settings.modulationEnabled;
            document.getElementById('modulationIntensityValue').textContent = `${settings.modulationIntensity}%`;
        }

        if (document.getElementById('modulationRateSlider')) {
            document.getElementById('modulationRateSlider').value = settings.modulationRate;
            document.getElementById('modulationRateSlider').disabled = !settings.modulationEnabled;
            document.getElementById('modulationRateValue').textContent = `${settings.modulationRate} Hz`;
        }

        disasterFrequency = settings.disasterFrequency;
        disasterProbability = settings.disasterProbability;
        disasterDuration = settings.disasterDuration;

        if (document.getElementById('disasterFrequencySlider')) {
            document.getElementById('disasterFrequencySlider').value = settings.disasterFrequency;
            document.getElementById('disasterFrequencyValue').textContent = settings.disasterFrequency;
        }

        if (document.getElementById('disasterProbabilitySlider')) {
            document.getElementById('disasterProbabilitySlider').value = settings.disasterProbability;
            document.getElementById('disasterProbabilityValue').textContent = settings.disasterProbability.toFixed(1);
        }

        if (document.getElementById('disasterDurationSlider')) {
            document.getElementById('disasterDurationSlider').value = settings.disasterDuration;
            document.getElementById('disasterDurationValue').textContent = settings.disasterDuration;
        }

        const infoPanel = document.getElementById('info-panel');
        if (infoPanel) {
            infoPanel.style.opacity = settings.infoPanelOpacity;
        }
    }

                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>

        opacityToggle.style.justifyContent = 'center';
