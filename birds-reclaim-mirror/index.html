<script>
'use strict';
// VÖGEL（ドイツ語で「鳥たち」。BIRDS RECLAIM から派生した映像インスタレーションの試作。フォルダ名は birds-reclaim-mirror のまま）

const $ = id => document.getElementById(id);
const cvT = $('t'), tc = cvT.getContext('2d'); // 題字と言葉を描く、いちばん上のキャンバス（ぼかしを弱くして、字を読めるままにする）
const stage = $('stage'), cvA = $('a'), cvB = $('b'), A = cvA.getContext('2d', { alpha: false }), c = cvB.getContext('2d'), video = $('v'), msgEl = $('msg'), panel = $('panel');
const QS = new URLSearchParams(location.search);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const hash = (a, b) => { const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return s - Math.floor(s); };

// ---------- 設定（H キーの中。localStorage に残す） ----------
const LS = 'birdsreclaim.mirror.v1';
const PHONE = matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) < 600;
// 既定値は、ユーザーがスマホで試して決めた値（2026-11-11）。鳥の大きさや払いの範囲は画面の大きさに比例するので PC も同じ値。マスの大きさ（px）だけ、PC は 14 のまま
const DEF = { cam: '', cell: PHONE ? 12 : 14, grow: 4, max: 220, bsz: 2.4, regrow: 4, fill: 'B', tone: 'bw', flash: 1, title: 1, amb: 1, sPeck: 0, sWing: 0, lag: 0, depth: 1, soft: 1.6, v: 2, sens: 1.3, swR: .7, swD: 1.3, grain: 1, mirror: 1, sound: 1, thr: .8, rs: 0, dbg: 0, inv: 0, test: 0 };
const SAVED = (() => { try { return JSON.parse(localStorage.getItem(LS) || '{}') || {}; } catch (e) { return {}; } })();
let CFG = Object.assign({}, DEF, SAVED);
if ((SAVED.v | 0) < 2) { CFG.lag = 0; CFG.v = 2; } // 前に保存した設定（版 2 より前）でも、「鏡が遅れる瞬間」は切から始める（ユーザー 2026-11-11：途中の変な演出は入れない）
const saveCfg = () => { try { localStorage.setItem(LS, JSON.stringify(Object.assign({}, CFG, { test: 0 }))); } catch (e) { } };
const UI = [
  ['cam', 'カメラ', 'select'],
  ['cell', 'マスの大きさ', 'range', 6, 40, 1, 'px'],
  ['grow', '鳥の増え方', 'range', .25, 6, .25, '倍'],
  ['max', '鳥の上限', 'range', 10, 300, 10, '羽'],
  ['bsz', '鳥の大きさ', 'range', .6, 4, .1, '倍'],
  ['regrow', '欠けが戻るまで', 'range', 1, 15, .5, '秒'],
  ['fill', '欠けた所', 'choice', [['A', 'A 部屋の背景'], ['B', 'B 草木']]],
  ['tone', '色', 'choice', [['bw', '白黒'], ['neg', 'ネガ'], ['color', 'カラー']]],
  ['flash', '総攻撃の一瞬だけ反転', 'check'],
  ['title', '無人の時は題の画面', 'check'],
  ['amb', 'かすかな低音', 'check'],
  ['sPeck', 'つつく音', 'check'],
  ['sWing', '羽音', 'check'],
  ['lag', '鏡が遅れる瞬間', 'check'],
  ['depth', '奥行き（手前を飛ぶ鳥）', 'check'],
  ['sens', '払う感度', 'range', .3, 3, .1, '倍'],
  ['swR', '払いが届く範囲', 'range', .5, 3, .1, '倍'],
  ['swD', '払われて離れる距離', 'range', .5, 3, .1, '倍'],
  ['grain', 'フィルムの粒子と傷', 'check'],
  ['soft', '輪郭のやわらかさ', 'range', 0, 3, .1, ''],
  ['mirror', '鏡像（左右反転）', 'check'],
  ['sound', '音', 'check'],
  ['thr', '輪郭のしきい値', 'range', .2, .95, .05, ''],
  ['rs', '描画の細かさ', 'choice', [[0, '自動'], [1, '1'], [1.5, '1.5'], [2, '2']]],
  ['dbg', '動きの検出を表示', 'check'],
  ['inv', '輪郭を反転（確認用）', 'check'],

const TONE = { bw: '白黒', neg: 'ネガ', color: 'カラー' };

// ---------- 画面とマス目 ----------
let W = 0, H = 0, RS = 1, SZ = 1;            // 画面（CSS px）、描画倍率、鳥などの寸法の倍率
let vw = 640, vh = 360;                      // 入力映像の大きさ
let SW = 256, SH = 144;                      // 切り出し用の小さな映像（横長モデルの入力と同じ 256×144）
let dw = 0, dh = 0, ox = 0, oy = 0;          // 映像を画面いっぱいに敷く時の大きさと位置
let cols = 0, rows = 0, NC = 0;
let occ, occF, hole, holeT, hp, lum, sidx;   // マスごと：人物か／なめらかにした値／欠けの残り秒／欠けた時の秒／強度／明るさ／映像の参照位置
let ex = new Int32Array(0), exN = 0;         // 外気に面したマス（鳥が狙う）
let colN, rowN, occN = 0, sxm = 0, sym = 0, bx0 = 0, bx1 = 0, by0 = 0, by1 = 0;

  const lim = PHONE ? 2.6e6 : 4.5e6; if (!(CFG.rs > 0) && W * H * RS * RS > lim) RS = Math.sqrt(lim / (W * H)); // 自動：画素が多すぎる時は落とす
  for (const cv of [cvA, cvB, cvT]) { cv.width = Math.max(1, Math.round(W * RS)); cv.height = Math.max(1, Math.round(H * RS)); }

  sidx = new Int32Array(NC * 4); ex = new Int32Array(NC); exN = 0; occN = 0; colN = new Int32Array(cols); rowN = new Int32Array(rows);
  for (let r = 0; r < rows; r++) for (let k = 0; k < cols; k++) { const i = r * cols + k; for (let j = 0; j < 4; j++) sidx[i * 4 + j] = srcIdx((k + (j & 1 ? .75 : .25)) * cs, (r + (j & 2 ? .75 : .25)) * cs); }

  applyLook();
}
function srcIdx(x, y) { let u = (x - ox) / dw; if (CFG.mirror) u = 1 - u; const v = (y - oy) / dh; return clamp(Math.floor(v * SH), 0, SH - 1) * SW + clamp(Math.floor(u * SW), 0, SW - 1); }

// ---------- 入力（カメラ／合成の人影／静止画）と、切り出し用の作業キャンバス ----------
const mkc = (w, h, o) => { const cv = document.createElement('canvas'); cv.width = w; cv.height = h; return [cv, cv.getContext('2d', o)]; };
let MODE = 'cam', src = video, srcOK = false, camErr = '';
let sc, sx, mkC, mkX, bkC, bkX, plC, plX, tmC, tmX, rmC, rmX, mkImg, bkImg, b1C, b1X, b2C, b2X; // 小さな映像／人物の覆い／背景の覆い／背景の板／作業用／人物を消した層
let PW = 480, PH = 270, MW = 32, MH = 18;
let mask, dilA, dilB, Y, heat, energy, firstY = true;
let hots = [];                               // 速く動いた所（画面座標）
function setSrc(w, h) {
  vw = w; vh = h; // 長い辺を 256 にする（縦画面のスマホでも、切り出しの画素数が増えない）
  if (vw >= vh) { SW = 256; SH = Math.max(16, Math.round(256 * vh / vw / 8) * 8); PW = 480; PH = Math.round(480 * vh / vw); } else { SH = 256; SW = Math.max(16, Math.round(256 * vw / vh / 8) * 8); PH = 480; PW = Math.round(480 * vw / vh); }

  [sc, sx] = mkc(SW, SH, { willReadFrequently: true }); [mkC, mkX] = mkc(SW, SH); [bkC, bkX] = mkc(SW, SH); [plC, plX] = mkc(PW, PH); [tmC, tmX] = mkc(PW, PH); [rmC, rmX] = mkc(PW, PH); [b1C, b1X] = mkc(Math.max(2, Math.round(PW / 60)), Math.max(2, Math.round(PH / 60))); [b2C, b2X] = mkc(Math.max(4, Math.round(PW / 15)), Math.max(4, Math.round(PH / 15)));

  mask = new Float32Array(SW * SH); dilA = new Float32Array(SW * SH); dilB = new Float32Array(SW * SH); Y = new Uint8Array(SW * SH); heat = new Float32Array(MW * MH); energy = new Float32Array(MW * MH); firstY = true; hots = [];
  layout(); if (typeof ensureSeg === 'function') ensureSeg();

function median(cnt, n) { let acc = 0; const half = n / 2; for (let k = 0; k < cnt.length; k++) { if (acc + cnt[k] >= half) return k + (half - acc) / cnt[k]; acc += cnt[k]; } return 0; } // マスの数の中央値（マスの中は按分）
function plateReset() { if (plX) plX.clearRect(0, 0, PW, PH); }

// ---------- 人物の切り出し（MediaPipe ImageSegmenter。ブラウザの中だけで動く） ----------
const MP_VER = '1.2.2';
const MP_CDN = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@' + MP_VER;
const MODELS = { // 横長の映像には横長モデル（入力 256×144）、縦長（スマホの縦持ち）には正方形モデル（256×256）
  landscape: ['selfie_segmenter_landscape.tflite', 'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter_landscape/float16/latest/selfie_segmenter_landscape.tflite'],
  square: ['selfie_segmenter.tflite', 'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite'],
};
let seg = null, segErr = '', segFrom = '', segDelegate = '', segKind = '', segBusy = false, personIdx = 1, segMs = 0, lastTs = 0, mpLib = null, mpFiles = null, mpLocal = false;
const wantKind = () => vh > vw * 1.1 ? 'square' : 'landscape';
const headOk = async u => { try { return (await fetch(u, { method: 'HEAD' })).ok; } catch (e) { return false; } };
async function loadLib() { // 同じフォルダの vendor/ に部品があれば、そちらを使う（展示用。通信なし）
  let base = MP_CDN; mpLocal = location.protocol !== 'file:' && !QS.has('cdn') && await headOk('vendor/tasks-vision/vision_bundle.mjs');
  if (mpLocal) base = new URL('vendor/tasks-vision', location.href).href;

  try {
    if (!mpLib) await loadLib();
    const [file, cdn] = MODELS[kind], local = mpLocal && await headOk('vendor/models/' + file), model = local ? new URL('vendor/models/' + file, location.href).href : cdn;
    let made = null, err = null;
    for (const delegate of QS.has('cpu') ? ['CPU'] : ['GPU', 'CPU']) {
      try { made = await mpLib.ImageSegmenter.createFromOptions(mpFiles, { baseOptions: { modelAssetPath: model, delegate }, runningMode: 'VIDEO', outputCategoryMask: false, outputConfidenceMasks: true }); segDelegate = delegate; break; } catch (e) { err = e; }
    }
    if (!made) throw err || new Error('ImageSegmenter を作れなかった');
    try { const L = made.getLabels(); const i = L.findIndex(x => /person|human/i.test(x)); if (i >= 0) personIdx = i; } catch (e) { }
    const old = seg; seg = made; segKind = kind; segErr = ''; segFrom = (local ? 'ローカル（通信なし）' : 'CDN（通信あり）') + '・' + (kind === 'square' ? '正方形' : '横長'); if (old) try { old.close(); } catch (e) { }
    if (srcOK && MODE === 'cam' && !startOpen()) say('', 0);
  } catch (e) { segErr = String(e && e.message || e); if (MODE !== 'test' && !startOpen()) say(segMsg(), 0); }
  finally { segBusy = false; if (!segErr && wantKind() !== segKind) loadSeg(wantKind()); } // 読み込み中に画面の向きが変わっていたら、もう一度
}
function ensureSeg() { loadSeg(wantKind()); }
function readMask(res, mask) { // mask＝書き込む先（合成の人影の時は捨てる）
  const ms = res.confidenceMasks; if (!ms || !ms.length) return;
  const m = ms.length > 1 ? ms[Math.min(personIdx, ms.length - 1)] : ms[0]; // マスクが1枚なら、それが人物の確からしさ（モデルカード：mask of person, [0,1]）
  const f = m.getAsFloat32Array(), mw = m.width, mh = m.height;

}

// ---------- 1コマぶんの「見る」：切り出し → 動き → 背景の板 → マス目 ----------
let segCount = 0, sinceSense = 9, bodyV = 0, calm = 1, pcx = 0, pcy = 0, pocc = 0, senseT = 0;
function sense() {
  sinceSense = 0; segCount++;

  if (MODE === 'test') { const m = tsx.getImageData(0, 0, SW, SH).data; for (let i = 0; i < n; i++) mask[i] = m[i * 4] / 255; }
  if (seg && (MODE !== 'test' || QS.has('seg'))) { // 合成の人影の時は、?seg を付けると切り出しも走らせて時間だけ測る
    const t0 = performance.now(), ts = Math.max(lastTs + 1, t0); lastTs = ts;
    try { seg.segmentForVideo(sc, ts, res => readMask(res, MODE === 'test' ? dilA : mask)); } catch (e) { segErr = String(e && e.message || e); }
    const el = performance.now() - t0; segMs = segMs ? segMs * .9 + el * .1 : el;
  }
  if (CFG.inv && MODE !== 'test') for (let i = 0; i < n; i++) mask[i] = 1 - mask[i];

  const S = { fps: +FPS.toFixed(1), fpsMin: fMin < 1e9 ? +fMin.toFixed(1) : null, fpsAvg: fN ? +(fSum / fN).toFixed(1) : null, segFps: +SFPS.toFixed(1), segMs: +segMs.toFixed(2), delegate: segDelegate, from: segFrom, birds: N, T: +T.toFixed(1), atk: +ATK.toFixed(2), occ: occN, exposed: exN, holes, eaten, present, intro: +intro.toFixed(2), lag: lagT > 0, front: birds.filter(b => b.fz && b.fz !== 4).length, back: birds.filter(b => b.fz === 4).length, inten: +inten.toFixed(2), calm: +calm.toFixed(2), bodyV: +bodyV.toFixed(3), mode: MODE, src: vw + '×' + vh, canvas: cvA.width + '×' + cvA.height, grid: cols + '×' + rows, form: N < 5 ? '—' : FORM[k], wave: wave > 0, hots: hots.length, segErr, camErr };
  window.__stats = S;
  if (!panel.classList.contains('show')) return;
  $('stat').textContent = '描画 ' + S.fps + ' コマ/秒（最低 ' + (S.fpsMin ?? '—') + '、平均 ' + (S.fpsAvg ?? '—') + '）\n輪郭 ' + S.segFps + ' コマ/秒　1コマ ' + S.segMs + ' ms　' + (S.delegate || '未読込') + '\n部品：' + (seg ? S.from : segErr ? '読めない（' + segErr + '）' : '読み込み中') + '\n入力：' + ({ cam: 'カメラ', test: '合成の人影', img: '静止画' })[MODE] + ' ' + S.src + '　画面 ' + S.canvas + '　マス ' + S.grid
    + '\n鳥 ' + N + ' 羽（' + S.form + (S.wave ? '・総攻撃' : '') + '）　攻撃 ' + S.atk + '\n映っている時間 ' + S.T + ' 秒　人物のマス ' + S.occ + '　欠け ' + S.holes + '　動き ' + S.hots + '（体の速さ ' + S.bodyV + '）';
}

// ---------- カメラ ----------
let stream = null;
function stopCam() { if (stream) { for (const t of stream.getTracks()) t.stop(); stream = null; } video.srcObject = null; }
async function startCam() {
  stopCam(); srcOK = false; camErr = '';
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { camErr = 'このページではカメラを使えません（https か localhost で開く）'; say('', 0); showStart(camErr); return; }
  const want = id => ({ audio: false, video: Object.assign({ width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 } }, id ? { deviceId: { exact: id } } : { facingMode: 'user' }) }); // 選んでいなければ、自分の側を向いたカメラ
  try {
    try { stream = await navigator.mediaDevices.getUserMedia(want(CFG.cam)); } catch (e) { if (!CFG.cam) throw e; stream = await navigator.mediaDevices.getUserMedia(want('')); }
    if (MODE !== 'cam') { stopCam(); return; }
    video.srcObject = stream; await video.play();
    const tr = stream.getVideoTracks()[0]; if (tr) tr.onended = () => { if (MODE !== 'cam') return; srcOK = false; say('カメラが切れた。つなぎ直すと、また始まる', 0); setTimeout(() => { if (MODE === 'cam' && !srcOK) startCam(); }, 3000); }; // 展示中にカメラが抜けても、自分でつなぎ直す
    MODE = 'cam'; src = video; setSrc(video.videoWidth || 1280, video.videoHeight || 720); srcOK = true; runT = 0; say(seg ? '' : segErr ? segMsg() : '人物の切り出しを読み込んでいます', 0);
    listCams();
  } catch (e) { camErr = (e && e.name) || String(e); say('', 0); showStart('カメラを使えません（' + camErr + '）\nブラウザのカメラの許可を確かめてください'); }
}
async function listCams() {
  try { const sel = $('c_cam'); if (!sel) return; const ds = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput'); const cur = stream && stream.getVideoTracks()[0] && stream.getVideoTracks()[0].getSettings().deviceId; sel.innerHTML = ''; ds.forEach((d, i) => { const o = document.createElement('option'); o.value = d.deviceId; o.textContent = d.label || 'カメラ ' + (i + 1); if (d.deviceId === cur) o.selected = true; sel.appendChild(o); }); } catch (e) { }
}
function useTest(on) {
  CFG.test = on ? 1 : 0; saveCfg(); resetBirds();
  if (on) { stopCam(); MODE = 'test'; src = tv; setSrc(640, 360); [tsC, tsx] = mkc(SW, SH, { willReadFrequently: true }); ST = 0; synth(); srcOK = true; say('合成の人影（カメラなし）', 2.5); }
  else { MODE = 'cam'; src = video; startCam(); }
}
function useImage(url) { // 確かめ用：?img=URL で静止画を入力にする（切り出しの向きを写真で確かめる）
  MODE = 'img'; const im = new Image(); im.crossOrigin = 'anonymous';
  im.onload = () => { const w = Math.min(1280, im.naturalWidth), h = Math.round(w * im.naturalHeight / im.naturalWidth), [cv, g] = mkc(w, h); g.drawImage(im, 0, 0, w, h); src = cv; setSrc(w, h); srcOK = true; say('', 0); };
  im.onerror = () => say('静止画を読めない', 0); im.src = url;
}
const segMsg = () => '人物の切り出しを読めません（' + segErr + '）\n通信を確かめてください';

// ---------- 画面の文字と、隠しUI ----------
let msgT = 0;
function say(s, sec) { msgEl.textContent = s; clearTimeout(msgT); if (sec) msgT = setTimeout(() => { msgEl.textContent = ''; }, sec * 1000); }
function applyLook() { // 画質：白黒と、わずかなぼかし（フィルムのやわらかさ。鳥や草木の輪郭がくっきりしすぎないように）
  const sf = (+CFG.soft || 0) * SZ / .64; // 値はスマホの画面での px。大きな画面では、画面の大きさに比例して広げる（見え方をそろえる）
  cvA.style.filter = (CFG.tone !== 'color' ? 'grayscale(1) contrast(1.1) ' : '') + (sf > 0 ? 'blur(' + (sf * .6).toFixed(2) + 'px)' : ''); cvB.style.filter = sf > 0 ? 'blur(' + sf.toFixed(2) + 'px)' : 'none'; cvT.style.filter = sf > 0 ? 'blur(' + (sf * .22).toFixed(2) + 'px)' : 'none';
}
function applyCfg(k) {
  if (k === 'cell' || k === 'mirror' || k === 'rs') layout();
  if (k === 'tone' || k === 'soft') applyLook();
  if (k === 'cam' && MODE === 'cam') startCam();
  if (k === 'sound' && MG) MG.gain.value = CFG.sound ? .7 : 0;
  if (k === 'max' || k === 'grow') { /* 次のコマから効く */ }
}
function buildUI() {
  const box = $('rows'); box.innerHTML = '';
  for (const [k, label, type, a, b, st, unit] of UI) {
    const row = document.createElement('div'); row.className = 'row'; const sp = document.createElement('span'); sp.textContent = label; row.appendChild(sp);
    const set = v => { CFG[k] = v; saveCfg(); applyCfg(k); };
    if (type === 'range') { const i = document.createElement('input'), v = document.createElement('span'); i.type = 'range'; i.min = a; i.max = b; i.step = st; i.value = CFG[k]; i.id = 'c_' + k; v.className = 'val'; v.textContent = CFG[k] + unit; i.oninput = () => { v.textContent = i.value + unit; set(+i.value); }; row.appendChild(i); row.appendChild(v); }
    else if (type === 'check') { const i = document.createElement('input'); i.type = 'checkbox'; i.checked = !!CFG[k]; i.id = 'c_' + k; i.onchange = () => set(i.checked ? 1 : 0); row.appendChild(i); }
    else if (type === 'choice') { const w = document.createElement('span'); for (const [val, text] of a) { const l = document.createElement('label'), i = document.createElement('input'); i.type = 'radio'; i.name = 'c_' + k; i.checked = String(CFG[k]) === String(val); i.onchange = () => set(val); l.appendChild(i); l.appendChild(document.createTextNode(' ' + text)); w.appendChild(l); } row.appendChild(w); }
    else { const s = document.createElement('select'); s.id = 'c_' + k; s.onchange = () => set(s.value); row.appendChild(s); }
    box.appendChild(row);
  }
  listCams();
}
function togglePanel() { const on = panel.classList.toggle('show'); if (on) { buildUI(); stat(); } wake(); }
let idleT = 0;
function wake() { document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => { if (!panel.classList.contains('show') && !startOpen()) document.body.classList.add('idle'); }, 3000); } // 3秒さわらなければ、歯車とカーソルを隠す
function fullscreen() { try { if (document.fullscreenElement) document.exitFullscreen(); else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => { }); else say('この端末では全画面にできません', 2); } catch (e) { } }
function setKey(k, v, text) { CFG[k] = v; saveCfg(); applyCfg(k); if (panel.classList.contains('show')) buildUI(); say(text, 1.8); }
// 見比べ用：パネルを開かずに、キーで少しずつ変える
const STEP = { ArrowUp: ['bsz', .2, .6, 4, '鳥の大きさ', '倍'], ArrowDown: ['bsz', -.2, .6, 4, '鳥の大きさ', '倍'], ArrowLeft: ['cell', -2, 6, 40, 'マスの大きさ', 'px'], ArrowRight: ['cell', 2, 6, 40, 'マスの大きさ', 'px'], '-': ['grow', -.5, .25, 6, '鳥の増え方', '倍'], '=': ['grow', .5, .25, 6, '鳥の増え方', '倍'], '+': ['grow', .5, .25, 6, '鳥の増え方', '倍'], '[': ['swD', -.3, .5, 3, '払われて離れる距離', '倍'], ']': ['swD', .3, .5, 3, '払われて離れる距離', '倍'], ';': ['swR', -.2, .5, 3, '払いが届く範囲', '倍'], "'": ['swR', .2, .5, 3, '払いが届く範囲', '倍'] };
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return; audioInit();
  if (e.target && /^(INPUT|SELECT)$/.test(e.target.tagName) && STEP[e.key]) return; // パネルのつまみを矢印で動かしている時は、そちらに任せる
  const k = e.key.toLowerCase();
  if (k === 'h') togglePanel();
  else if (k === 'f') fullscreen();
  else if (k === 'a') setKey('fill', 'A', '欠けた所：A 部屋の背景');
  else if (k === 'b') setKey('fill', 'B', '欠けた所：B 草木');
  else if (k === 'n') { const o = ['bw', 'neg', 'color'], v = o[(o.indexOf(CFG.tone) + 1) % 3]; setKey('tone', v, '色：' + TONE[v]); }
  else if (k === 'g') setKey('grain', CFG.grain ? 0 : 1, '粒子と傷：' + (CFG.grain ? 'なし' : 'あり'));
  else if (k === 'm') setKey('sound', CFG.sound ? 0 : 1, '音：' + (CFG.sound ? 'なし' : 'あり'));
  else if (k === 'd') setKey('dbg', CFG.dbg ? 0 : 1, '動きの検出の表示：' + (CFG.dbg ? 'なし' : 'あり'));
  else if (k === 'r') { plateReset(); say('背景を撮り直す', 1.8); }
  else if (k === '0') { resetBirds(); say('鳥をやり直す', 1.8); }
  else if (STEP[e.key]) { const [key, d, lo, hi, label, unit] = STEP[e.key], v = clamp(Math.round((CFG[key] + d) * 100) / 100, lo, hi); e.preventDefault(); setKey(key, v, label + '：' + v + unit); }
});
for (const ev of ['pointerdown', 'click', 'touchend']) addEventListener(ev, audioInit);
for (const ev of ['pointermove', 'pointerdown', 'keydown']) addEventListener(ev, wake);
$('gear').onclick = togglePanel; $('bClose').onclick = togglePanel;
addEventListener('resize', layout);
if (navigator.mediaDevices) navigator.mediaDevices.addEventListener('devicechange', () => { listCams(); if (MODE === 'cam' && !srcOK) startCam(); });
$('bPlate').onclick = () => { plateReset(); say('背景を撮り直す', 1.8); };
$('bBirds').onclick = () => { resetBirds(); say('鳥をやり直す', 1.8); };
$('bFull').onclick = fullscreen;
$('bDef').onclick = () => { const t = CFG.test, cam = CFG.cam; CFG = Object.assign({}, DEF, { test: t, cam }); saveCfg(); applyLook(); if (MG) MG.gain.value = .7; layout(); buildUI(); };

// ---------- 始まりの画面と、始める ----------
// 開いたら、題の画面のままカメラを始める（ユーザー指示 2026-11-11：始め方はカメラしかないので、「カメラで始める」の画面はいらない）。
// この重ねた画面は、カメラを使えなかった時だけ出す（理由と、やり直しのボタン）
const startEl = $('start'), startOpen = () => startEl.classList.contains('show');
function showStart(err) { $('sErr').textContent = err || ''; startEl.classList.add('show'); document.body.classList.remove('idle'); }
function hideStart() { startEl.classList.remove('show'); wake(); }
$('sCam').onclick = () => { hideStart(); audioInit(); MODE = 'cam'; startCam(); };
applyLook();
setSrc(640, 360);
(async () => {
  if (QS.get('img')) return useImage(QS.get('img'));
  if (QS.has('test')) return useTest(true);
  startCam();
})();
wake();
requestAnimationFrame(loop);
// 確かめ用：コンソールから状態を見たり、時間を進めたりできる（展示では使わない）
window.__dbg = { lag(v) { lagT = v; }, titleCries: () => titleCries, glitch(v, m) { glT = v; glMode = m | 0; glSeed = Math.random() * 900; }, quote: () => ({ qi, o: QUOTES[qi].o }), nextQuote, amb: () => AMB ? { state: AC.state, dr: +AMB.dr.gain.value.toFixed(3), out: +AMB.out.gain.value.toFixed(2), fl: FL ? +FL.out.gain.value.toFixed(3) : null } : null, cry: n => cry(n || 1, .2), useCanvas(cv) { MODE = 'img'; src = cv; setSrc(cv.width, cv.height); srcOK = true; hideStart(); }, get T() { return T; }, set T(v) { T = v; }, get ST() { return ST; }, set ST(v) { ST = v; }, birds, cfg: () => CFG, step(n, dt) { for (let i = 0; i < n; i++) tick(dt || 1 / 60); draw(); stat(); return window.__stats; }, stat: () => { stat(); return window.__stats; }, bench(n, dt, flush) { const [, fx] = mkc(1, 1, { willReadFrequently: true }); const t0 = performance.now(); for (let i = 0; i < n; i++) { tick(dt || 1 / 60); draw(); if (flush) { fx.drawImage(cvA, 0, 0, 1, 1, 0, 0, 1, 1); fx.drawImage(cvB, 0, 0, 1, 1, 0, 0, 1, 1); fx.getImageData(0, 0, 1, 1); } } return (performance.now() - t0) / n; }, /* flush＝GPU の描画が終わるのを毎コマ待つ（重めに出る） */ hots: () => hots, hole: () => hole, occ: () => occ, mask: () => mask, set: (k, v) => { CFG[k] = v; applyCfg(k); } };
</script>
