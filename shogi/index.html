<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>CYBER_SHOGI — 電脳将棋</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%2305080f'/%3E%3Cpath d='M4.5 17V9l4.5 3.5L12 5.5 15 12.5 19.5 9v8z' fill='none' stroke='%2319e3ff' stroke-width='1.7'/%3E%3C/svg%3E">
<link rel="stylesheet" href="03_assets/style.css?v=62eed12feb">
</head>
<body>
<div id="app">

  <div id="boot" class="screen on">
    <h1 class="logo" data-txt="CYBER_SHOGI">CYBER<span>_</span>SHOGI</h1>
    <div class="sub">電脳将棋 :: INTRUSION PROTOCOL</div>
    <div id="boot-tap">▸ TAP TO CONNECT ◂</div>
  </div>

  <div id="title" class="screen">
    <canvas id="net-bg"></canvas>
    <div id="title-inner">
      <h1 class="logo" data-txt="CYBER_SHOGI">CYBER<span>_</span>SHOGI</h1>
      <div class="sub">電脳将棋 :: FACTION WARS</div>
      <div id="marquee"><span class="mq"></span></div>
      <button class="menu-btn" id="bt-free">FREE RUN — 侵入開始</button>
      <button class="menu-btn mg" id="bt-daily">DAILY RUN — 本日のシード</button>
      <button class="menu-btn sm" id="bt-howto">HOW TO PLAY — 遊び方</button>
      <div id="route-card"></div>
      <div id="title-foot"><span id="bt-mute-title">SOUND ON</span> ・ CYBER_SHOGI v4a</div>
    </div>
  </div>

  <div id="game" class="screen">
    <div id="hud">
      <span class="stg" id="hud-stage">STAGE 1</span>
      <span class="scr" id="hud-score">SCORE 0</span>
      <span class="seed" id="hud-seed"></span>
    </div>
    <div class="hand" id="hand-e"><span class="lbl">敵捕獲:</span></div>
    <div id="board"></div>
    <div class="hand" id="hand-p"><span class="lbl">乗っ取り済:</span></div>
    <div id="ctrl">
      <button class="cbtn warn" id="bt-ddos">DDoS ×0</button>
      <button class="cbtn" id="bt-kifu">棋譜LOG</button>
      <button class="cbtn" id="bt-mute">SOUND ON</button>
      <button class="cbtn" id="bt-quit">切断</button>
    </div>
    <div id="term"></div>
  </div>

</div>

<div class="modal" id="upg-modal">
  <h2>SYSTEM BREACHED</h2>
  <div class="note">侵入成功 — サイバー強化を1つ選択せよ</div>
  <div id="upg-cards"></div>
</div>

<div class="modal" id="end-modal">
  <div id="end-body"></div>
</div>

<div class="modal" id="kifu-modal">
  <h2>KIFU LOG</h2>
  <div id="kifu-wrap"><textarea id="kifu-txt" readonly></textarea></div>
  <button class="menu-btn" id="bt-kifu-close" style="margin-top:14px;">CLOSE</button>
</div>

<div class="modal" id="howto-modal">
  <div id="howto-card">
    <h2 id="howto-title"></h2>
    <div id="howto-body"></div>
    <div id="howto-nav">
      <button class="cbtn" id="howto-prev">◀ PREV</button>
      <span id="howto-pos"></span>
      <button class="cbtn" id="howto-next">NEXT ▶</button>
    </div>
    <button class="menu-btn sm" id="howto-close" style="margin-top:12px;">CLOSE</button>
  </div>
</div>

<div class="modal" id="hint-modal">
  <div id="hint-card">
    <h2 id="hint-title"></h2>
    <div id="hint-body"></div>
    <div class="tapcont">— TAP TO CONTINUE —</div>
  </div>
</div>

<div class="stage-banner" id="banner">
  <div class="bn-main" id="banner-txt"></div>
  <div class="bn-sub" id="banner-sub"></div>
</div>

<script src="shogi.bundle.js?v=a2c0f8d368"></script>
</body>
</html>
