<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>CYBER_SHOGI — 電脳将棋</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%2305080f'/%3E%3Cpath d='M4.5 17V9l4.5 3.5L12 5.5 15 12.5 19.5 9v8z' fill='none' stroke='%2319e3ff' stroke-width='1.7'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="03_assets/style.css?v=13c19b55de">
</head>
<body>
<div id="app">

  <div id="boot" class="screen on">
    <div class="g-wrap">
      <div class="g-meta"><span>CYBER_SHOGI</span><span>電脳将棋</span><span>2026</span></div>
      <h1 class="g-logo">CYBER<span class="us">_</span><br>SHOGI</h1>
      <div id="boot-tap"><span class="g-dot"></span>Tap to connect</div>
    </div>
  </div>

  <div id="title" class="screen">
    <canvas id="net-bg"></canvas>
    <div class="g-wrap">
      <div class="g-meta"><span>CYBER_SHOGI</span><span>Intrusion protocol / 5&times;5</span><span id="g-clock"></span></div>
      <div class="g-main">
        <div class="g-left">
          <h1 class="g-logo" data-txt="CYBER_SHOGI">CYBER<span class="us">_</span><br>SHOGI</h1>
          <p class="g-lede">電脳将棋 — 奪った駒を乗っ取り、敵の回線を切断する。<br>5&times;5、一局三分の侵入戦。</p>
        </div>
        <div class="g-right">
          <nav class="g-menu">
            <button id="bt-free"><i>01</i><b>Free run</b><em>侵入開始</em></button>
            <button id="bt-daily"><i>02</i><b>Daily run</b><em>本日のシード</em></button>
            <button id="bt-howto"><i>03</i><b>How to play</b><em>遊び方</em></button>
          </nav>
          <section id="route-card"></section>
        </div>
      </div>
      <div id="marquee"><span class="mq"></span></div>
      <div id="title-foot"><span id="bt-mute-title">SOUND ON</span><span>v4c</span></div>
    </div>
  </div>

  <div id="game" class="screen">
    <div id="hud">
      <span class="stg" id="hud-stage">STAGE 1</span>
      <span class="scr" id="hud-score">SCORE 0</span>
      <span class="seed" id="hud-seed"></span>
    </div>
    <div class="hand" id="hand-e"><span class="lbl">敵捕獲:</span></div>
    <div id="board"></div>
    <div class="hand" id="hand-p"><span class="lbl">乗っ取り済:</span></div>
    <div id="ctrl">
      <button class="cbtn warn" id="bt-ddos">DDoS ×0</button>
      <button class="cbtn" id="bt-kifu">棋譜LOG</button>
      <button class="cbtn" id="bt-mute">SOUND ON</button>
      <button class="cbtn" id="bt-quit">切断</button>
    </div>
    <div id="term"></div>
  </div>

</div>

<div class="modal" id="upg-modal">
  <h2>SYSTEM BREACHED</h2>
  <div class="note">侵入成功 — サイバー強化を1つ選択せよ</div>
  <div id="upg-cards"></div>
</div>

<div class="modal" id="end-modal">
  <div id="end-body"></div>
</div>

<div class="modal" id="kifu-modal">
  <h2>KIFU LOG</h2>
  <div id="kifu-wrap"><textarea id="kifu-txt" readonly></textarea></div>
  <button class="menu-btn" id="bt-kifu-close" style="margin-top:14px;">CLOSE</button>
</div>

<div class="modal" id="howto-modal">
  <div id="howto-card">
    <h2 id="howto-title"></h2>
    <div id="howto-body"></div>
    <div id="howto-nav">
      <button class="cbtn" id="howto-prev">◀ PREV</button>
      <span id="howto-pos"></span>
      <button class="cbtn" id="howto-next">NEXT ▶</button>
    </div>
    <button class="menu-btn sm" id="howto-close" style="margin-top:12px;">CLOSE</button>
  </div>
</div>

<div class="modal" id="hint-modal">
  <div id="hint-card">
    <h2 id="hint-title"></h2>
    <div id="hint-body"></div>
    <div class="tapcont">— TAP TO CONTINUE —</div>
  </div>
</div>

<div class="stage-banner" id="banner">
  <div class="bn-main" id="banner-txt"></div>
  <div class="bn-sub" id="banner-sub"></div>
</div>

<script src="shogi.bundle.js?v=51be825bcf"></script>
</body>
</html>
