<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>boot backdrop lab</title>
<style>
html,body{margin:0;background:#020306;color:#9aa4b8;font:12px -apple-system,"Hiragino Sans",sans-serif}
body{display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:8px 0}
#bar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:4px 8px;margin-bottom:6px}
button{background:#0d111b;color:#9aa4b8;border:1px solid #2a3348;border-radius:14px;padding:6px 12px;font:inherit}
button.on{color:#06080E;background:#63D8C9;border-color:#63D8C9}
#wrap{width:min(360px,100vw);aspect-ratio:360/640;max-height:calc(100vh - 56px)}
canvas{width:100%;height:100%;display:block;background:#06080E}
</style></head><body>
<div id="bar">
<button id="bA">A Simple motion</button><button id="bB">B Solar system dim</button><button id="bR">reduce motion</button>
</div>
<div id="wrap"><canvas id="c"></canvas></div>
<script type="module" src="boot.js"></script>
</body></html>
