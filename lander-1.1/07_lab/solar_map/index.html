<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LANDER Solar Map Lab</title>
<style>
  :root { --bg:#06080E; --pn:#0D111B; --dim:#5B667C; --mid:#63D8C9; --fg:#ECE6D8; --warn:#FFB547; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--fg); font:12px/1.3 -apple-system,"SF Pro Text","Helvetica Neue","Hiragino Sans",sans-serif; -webkit-tap-highlight-color: transparent; }
  #ctl { padding:8px 10px 6px; display:flex; flex-direction:column; gap:6px; align-items:center; border-bottom:1px solid #141a28; }
  .row { display:flex; flex-wrap:wrap; gap:6px; align-items:center; justify-content:center; }
  .lbl { color:var(--dim); letter-spacing:.14em; font-size:10px; margin-right:2px; }
  button { font:inherit; color:var(--fg); background:var(--pn); border:1px solid #232b3d; border-radius:8px; padding:6px 10px; min-height:30px; cursor:pointer; }
  button:hover { border-color:var(--dim); }
  button.on { border-color:var(--mid); color:var(--mid); background:#0b1a1d; }
  label { display:flex; gap:4px; align-items:center; color:#aab2c2; cursor:pointer; }
  #stage { display:flex; justify-content:center; padding:6px 0 14px; }
  canvas { display:block; touch-action:manipulation; background:var(--bg); border-radius:14px; box-shadow:0 0 0 1px #141a28; }
</style>
</head>
<body>
<div id="ctl">
  <div class="row"><span class="lbl">STYLE</span>
    <button data-style="A">A Minimal orrery</button>
    <button data-style="B">B Retro-future</button>
    <button data-style="C">C Cute toybox</button>
    <button data-style="D">D Instrument + toy motion</button>
  </div>
  <div class="row">
    <label><input type="checkbox" id="rm"> reduce motion</label>
    <label><input type="checkbox" id="faces"> faces</label>
    <label><input type="checkbox" id="snd"> ticks</label>
    <button id="replay">replay unlock</button>
    <button id="intro">replay intro</button>
    <button id="reset">reset</button>
  </div>
</div>
<div id="stage"><canvas id="cv" aria-label="Solar system map prototype"></canvas></div>
<script type="module" src="map.js?v=872b522a2f"></script>
</body>
</html>
